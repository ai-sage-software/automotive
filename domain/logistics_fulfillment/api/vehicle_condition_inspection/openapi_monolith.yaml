          maxLength: 120
          minLength: 1
          type: string
          description: Unique global internal or external business key.
          example: VTOBS-TIRE-PRESSURE-LF-20260724-0001
        vehicle_telemetry_observation_id:
          maxLength: 60
          minLength: 1
          type: string
          description: Unique system-specific internal identifier.
          example: "864867285876080651"
        metric_code:
          maxLength: 100
          minLength: 1
          type: string
          description: Canonical code identifying the telemetry metric represented
            by the observation.
          example: TIRE_PRESSURE_LEFT_FRONT
        source_system_code:
          maxLength: 100
          minLength: 1
          type: string
          description: "Code identifying the authoritative system, platform, gateway,\
            \ or service that supplied the telemetry observation."
          example: OEM_CONNECTED_VEHICLE_PLATFORM
        source_device_key:
          maxLength: 120
          minLength: 1
          type: string
          description: Unique global internal or external business key.
          example: DEVICE-VEHICLE-GATEWAY-993211
        sensor_identifier:
          maxLength: 120
          minLength: 1
          type: string
          description: "Identifier assigned to the sensor, electronic control unit,\
            \ module, or logical measurement source that generated the observation."
          example: TPMS-LF-01
        position_reference_key:
          maxLength: 120
          minLength: 1
          type: string
          description: Unique global internal or external business key.
          example: POSITION-OBS-864867285876080651
        valid_indicator:
          type: boolean
          description: Indicates whether the telemetry observation passed validation
            and is considered usable.
          example: true
        estimated_indicator:
          type: boolean
          description: Indicates whether the observation value was estimated rather
            than directly measured.
          example: false
        derived_indicator:
          type: boolean
          description: "Indicates whether the observation was calculated, inferred,\
            \ aggregated, or otherwise derived from one or more source measurements."
          example: false
        occurrence_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-10-14T07:33:22Z
        sequence_number:
          minimum: 0
          type: integer
          description: Monotonically increasing sequence number assigned by the source
            device or system for event ordering and replay detection.
          format: int64
          example: 192847
        confidence_score:
          type: string
          description: Confidence score indicating how strongly the source or processing
            system believes the telemetry observation is accurate. Values range from
            0.0 through 1.0.
          example: "0.96"
        data_quality_score:
          type: string
          description: "Quality score representing the completeness, validity, consistency,\
            \ and reliability of the telemetry observation. Values range from 0.0\
            \ through 1.0."
          example: "0.94"
        aggregation_type:
          $ref: "#/components/schemas/AggregationTypes"
        effective_period:
          $ref: "#/components/schemas/EffectivePeriod"
        observation_codes:
          $ref: "#/components/schemas/Codes"
        metric_type:
          $ref: "#/components/schemas/VehicleTelemetryMetricTypes"
        service_milestone_types:
          $ref: "#/components/schemas/ServiceMilestoneTypes"
        correlation_id:
          maxLength: 120
          minLength: 1
          type: string
          description: Unique system-specific internal identifier.
          example: CORR-882211
        metric_value:
          $ref: "#/components/schemas/MetricValue"
        recorded_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-10-14T07:33:22Z
        source:
          type: string
          description: "Origin of the telemetry data (e.g., MANUAL_ADVISOR_INPUT,\
            \ TELEMATICS_DONGLE, OBD_SCANNER)."
          example: OBD_SCANNER
      description: vehicle.telemetry.observation.desc
    VehicleTelemetryObservations:
      type: array
      items:
        $ref: "#/components/schemas/VehicleTelemetryObservation"
    Violation:
      type: object
      properties:
        pointer:
          type: string
          description: A JSON Pointer (RFC 6901) referencing the specific field in
            the request body that caused the violation.
          example: "#/vehicle_license/plate_number"
        code:
          type: string
          description: "A stable, machine-readable string identifying the specific\
            \ validation rule that was breached."
          example: PATTERN_MISMATCH
        message:
          type: string
          description: "A localized, human-readable description of the validation\
            \ error."
          example: The plate number must be alphanumeric and between 1 and 20 characters.
        severity:
          type: string
          description: The impact level of this violation. ERROR blocks execution;
            WARNING is advisory.
          example: ERROR
          enum:
          - ERROR
          - WARNING
          - INFO
        metadata:
          type: object
          additionalProperties:
            type: string
            description: Metadata value
          description: "Contextual key-value pairs to help resolve the error (e.g.,\
            \ actual vs. expected limits)."
          example:
            regex: "^[A-Z0-9]{1,20}$"
        rule:
          type: string
          description: The specific validation rule name.
          example: INSUFFICIENT_FUNDS
        path:
          type: string
          description: The property path notation for the error.
          example: date_range.start
      description: "An individual validation failure within a request, providing a\
        \ direct map to the offending field."
