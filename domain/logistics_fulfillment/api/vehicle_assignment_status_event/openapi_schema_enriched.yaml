openapi: 3.0.1
info:
  title: Automotive Retail Systems API - VehicleAssignmentStatusEvent
  description: "A standardized interface for Automotive Retail operations, built upon\
    \ a formal Retail Ontology. It enables seamless integration \n\n**Key Capabilities:**\n\
    * **Catalog Management:** Unified definitions for parts, assemblies, and BOMs.\n\
    * **Inventory Orchestration:** Real-time visibility into warehouse and dealership\
    \ stock.\n* **Financial Workflows:** Automated invoicing and batch processing\
    \ for high-volume retail transactions.\n\nDesigned for high-reliability CI/CD\
    \ environments and asynchronous batch processing."
  contact:
    name: STAR Standards Platform Architecture
    url: https://www.starstandard.org
    email: architecture@starstandard.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://api.starstandard.org/v1
  description: Production server
- url: https://sandbox.starstandard.org/v1
  description: Sandbox for testing
paths: {}
components:
  schemas:
    Code:
      type: object
      properties:
        code_id:
          maxLength: 50
          minLength: 5
          type: string
          description: Internal system-generated unique identifier for the code record.
          example: cd-9902-v1
        code_key:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique business reference key used to identify the code's context.
          example: VEHICLE_STATUS_CODE
        code:
          maxLength: 50
          minLength: 1
          type: string
          description: The literal value or mnemonic represented by this record.
          example: IN_TRANSIT
        description:
          maxLength: 255
          minLength: 5
          type: string
          description: A human-readable explanation of what the code represents.
          example: Indicates the vehicle has left the factory but not yet arrived
            at the dealer.
      description: not nullable
    Codes:
      type: array
      items:
        $ref: "#/components/schemas/Code"
    VehicleAssignmentStageTypes:
      type: string
      description: types of vehicle assignment stages.
      enum:
      - INITIATE
      - OPEN
      - APPOINTMENT
      - CHECKIN
      - VEHICLE_DELIVERY_IN
      - EVAL
      - EVAL_QUEUE
      - EVAL_CONSULTATION
      - PROPOSAL_BUILD
      - CUSTOMER_AUTHORIZATION
      - ACTIVE
      - WORK_IN_PROGRESS
      - ORDER_PARTS
      - DISASSEMBLE
      - REPAIR
      - REASSEMBLE
      - DETAIL
      - QUALITY_ASSURANCE
      - COMPLETION
      - CHECKOUT
      - VEHICLE_DELIVERY_OUT
      - FOLLOW_UP
      - CLOSE
      - INVOICE
      - RE_OPEN
      - CLOSED
      - CANCELLED
      - ON_HOLD
      - OTHER
    VehicleAssignmentStatusEvent:
      type: object
      properties:
        vehicle_assignment_status_event_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable identifier representing a vehicle assignment
            status transition event.
          example: VASE-882211
        vehicle_assignment_status_event_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external or provider-generated identifier associated with
            the assignment status event.
          example: ASSIGN-EVT-2026-00991
        vehicle_assignment_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The vehicle assignment key associated with this status transition
            event.
          example: VASSIGN-882211
        event_sequence_num:
          maxLength: 20
          minLength: 1
          type: string
          description: The chronological sequence number of the assignment status
            event.
          example: "3"
        assignment_status_type:
          $ref: "#/components/schemas/VehicleAssignmentStatusTypes"
        assignment_stage_type:
          $ref: "#/components/schemas/VehicleAssignmentStageTypes"
        previous_assignment_status_type:
          $ref: "#/components/schemas/VehicleAssignmentStatusTypes"
        previous_assignment_stage_type:
          $ref: "#/components/schemas/VehicleAssignmentStageTypes"
        event_source:
          maxLength: 120
          minLength: 1
          type: string
          description: "The system, user, dispatcher, or provider that generated the\
            \ assignment status event."
          example: FLEET_DISPATCH
        performed_by:
          maxLength: 120
          minLength: 1
          type: string
          description: "The actor, dispatcher, driver, system, or service that performed\
            \ or triggered the assignment status event."
          example: DISPATCHER-1001
        occurrence_date_time:
          type: string
          description: The timestamp documenting when the assignment status event
            occurred.
          format: date-time
          example: 2026-10-19T08:32:27Z
        recorded_date_time:
          type: string
          description: The timestamp documenting when the assignment status event
            was recorded by the platform.
          format: date-time
          example: 2026-10-19T08:32:27Z
        assignment_status_codes:
          $ref: "#/components/schemas/Codes"
        comments:
          maxLength: 4000
          minLength: 1
          type: string
          description: Operational comments or explanatory details associated with
            the assignment status event.
          example: Vehicle assignment activated for regional delivery route.
      description: Basic Definition of Opportunity
    VehicleAssignmentStatusEventCreate:
      required:
      - vehicle_assignment_status_event_key
      type: object
      description: VehicleAssignmentStatusEvent Create for Post
      allOf:
      - $ref: "#/components/schemas/VehicleAssignmentStatusEvent"
    VehicleAssignmentStatusEventUpdate:
      type: object
      properties:
        comments:
          maxLength: 4000
          minLength: 1
          type: string
          description: Operational comments or explanatory details associated with
            the assignment status event.
          example: Vehicle assignment activated for regional delivery route.
        performed_by:
          maxLength: 120
          minLength: 1
          type: string
          description: "The actor, dispatcher, driver, system, or service that performed\
            \ or triggered the assignment status event."
          example: DISPATCHER-1001
        assignment_status_type:
          $ref: "#/components/schemas/VehicleAssignmentStatusTypes"
        event_sequence_num:
          maxLength: 20
          minLength: 1
          type: string
          description: The chronological sequence number of the assignment status
            event.
          example: "3"
        event_source:
          maxLength: 120
          minLength: 1
          type: string
          description: "The system, user, dispatcher, or provider that generated the\
            \ assignment status event."
          example: FLEET_DISPATCH
        previous_assignment_status_type:
          $ref: "#/components/schemas/VehicleAssignmentStatusTypes"
        occurrence_date_time:
          type: string
          description: The timestamp documenting when the assignment status event
            occurred.
          format: date-time
          example: 2026-10-19T08:32:27Z
        assignment_status_codes:
          $ref: "#/components/schemas/Codes"
        assignment_stage_type:
          $ref: "#/components/schemas/VehicleAssignmentStageTypes"
        recorded_date_time:
          type: string
          description: The timestamp documenting when the assignment status event
            was recorded by the platform.
          format: date-time
          example: 2026-10-19T08:32:27Z
        previous_assignment_stage_type:
          $ref: "#/components/schemas/VehicleAssignmentStageTypes"
      description: VehicleAssignmentStatusEvent Update for Patch and Put
    VehicleAssignmentStatusTypes:
      type: string
      description: types of vehicle assignment status.
      enum:
      - INITIATING
      - PENDING_APPROVAL
      - APPROVED
      - ACTIVE
      - SALES_HOLD
      - PAYMENT_HOLD
      - FINANCE_HOLD
      - CUSTOMER_HOLD
      - ON_HOLD
      - COMPLETE
      - DECLINED
      - REJECT
      - CANCELLED
      - ABANDON
      - INVALID
      - INACTIVE
      - UNKNOWN
      - OTHER
