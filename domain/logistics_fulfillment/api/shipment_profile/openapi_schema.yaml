          minLength: 1
          type: string
          description: The target parts invoice line item business ID being satisfied
            by this physical shipment event.
          example: INV-ITEM-8822A
        context:
          maxLength: 120
          minLength: 1
          type: string
          description: "Audit tracing metadata detailing the tracking scope, package\
            \ group, or batch configuration rules."
          example: STAGE_BIN_B4
        occurrence_date_time:
          type: string
          description: The date and time this package item allocation event occurred
            at the packing station.
          format: date-time
          example: 2026-07-27T15:56:11Z
        quantity_shipped:
          maxLength: 40
          minLength: 1
          type: string
          description: High-precision string representation of the specific part quantity
            allocated inside this package shipment.
          example: "4.00"
        unit_of_measure:
          $ref: "#/components/schemas/UnitOfMeasure"
        manifest_line_weight:
          $ref: "#/components/schemas/MetricValue"
        part_condition_type:
          $ref: "#/components/schemas/ConditionTypes"
        part_identifier_reference:
          $ref: "#/components/schemas/PartIdentifierReference"
        container_reference_id:
          maxLength: 80
          minLength: 1
          type: string
          description: "The explicit sub-container mapping identity (e.g. Pallet Number,\
            \ Tote ID, Box Size Tag)."
          example: PALLET-02
        serialized_identifiers:
          $ref: "#/components/schemas/Codes"
      description: The explicit operational link mapping physical package fulfillment
        quantities back to financial parts invoice lines.
    ShipmentManifestLines:
      type: array
      items:
        $ref: "#/components/schemas/ShipmentManifestLine"
    ShipmentProfile:
      type: object
      properties:
        shipment_profile_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable enterprise shipment profile identifier.
          example: SHIP-882211
        shipment_profile_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external or provider-generated shipment profile identifier.
          example: SHIP-PROFILE-2026-001
        reference_key:
          maxLength: 120
          minLength: 1
          type: string
          description: The business reference key associated with the shipment.
          example: REF-2026-00991
        case_number:
          maxLength: 80
          minLength: 1
          type: string
          description: The operational case number associated with the shipment.
          example: CASE-882211
        shipment_state_type:
          $ref: "#/components/schemas/ShipmentStateTypes"
        shipment_priority_type:
          maxLength: 40
          minLength: 1
          type: string
          description: The operational priority associated with the shipment.
          example: EXPEDITED
        shipping_method_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/ShippingMethodTypes"
        shipping_carriers:
          $ref: "#/components/schemas/PartyReferences"
        ship_from_party:
          $ref: "#/components/schemas/PartyReference"
        ship_to_party:
          $ref: "#/components/schemas/PartyReference"
        ship_from_address:
          $ref: "#/components/schemas/AddressReference"
        ship_to_address:
          $ref: "#/components/schemas/AddressReference"
        country_of_origin:
          maxLength: 120
          minLength: 1
          type: string
          description: The country of origin associated with the shipment.
          example: United States
        bill_of_lading_number:
          maxLength: 120
          minLength: 1
          type: string
          description: The bill of lading number associated with the shipment.
          example: BOL-882211
        packing_slip_number:
          maxLength: 120
          minLength: 1
          type: string
          description: The packing slip number associated with the shipment.
          example: PS-2026-001
        tracking_informations:
          $ref: "#/components/schemas/TrackingInformations"
        shipment_events:
          $ref: "#/components/schemas/ShipmentEvents"
        shipment_period:
          $ref: "#/components/schemas/EffectivePeriod"
        shipment_manifest_lines:
          $ref: "#/components/schemas/ShipmentManifestLines"
        invoice_references:
          $ref: "#/components/schemas/InvoiceReferences"
        vehicle_reference:
          $ref: "#/components/schemas/VehicleReference"
        fleet_reference:
          $ref: "#/components/schemas/FleetReference"
        shipment_weight:
          $ref: "#/components/schemas/MetricValue"
        package_count:
          type: integer
          description: The number of packages associated with the shipment.
          format: int32
          example: 12
        signature_required_indicator:
          type: boolean
          description: Indicates whether signature confirmation is required for delivery.
          example: true
        hazardous_material_indicator:
          type: boolean
          description: Indicates whether hazardous materials are associated with the
            shipment.
          example: false
        shipment_source:
          maxLength: 120
          minLength: 1
          type: string
          description: "The source system, provider, dispatcher, OEM, dealer, or logistics\
            \ platform associated with the shipment."
          example: OEM_LOGISTICS
        shipment_codes:
          $ref: "#/components/schemas/Codes"
        logistics_identifiers:
          $ref: "#/components/schemas/Identifiers"
        comments:
          maxLength: 4000
          minLength: 1
          type: string
          description: Operational comments or notes associated with the shipment.
          example: Shipment delayed due to weather conditions.
        service_level_type:
          $ref: "#/components/schemas/ServiceLevelTypes"
        transport_method_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/TransportMethodTypes"
        delivery_profile:
          $ref: "#/components/schemas/DeliveryProfile"
      description: A single logistically tracked shipment containing individual manifest
        breakdown lines.
    ShipmentStateTypes:
      type: string
      description: types of shipment states.
      enum:
      - OPEN
      - ACTIVE
      - TRACKED
      - DELIVERED
      - RETURNED_TO_WAREHOUSE
      - LOST_IN_TRANSIT
    ShippingMethodTypes:
      type: string
