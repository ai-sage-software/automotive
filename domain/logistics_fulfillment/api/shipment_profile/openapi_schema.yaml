      - THREE_DAY_SELECT
      - EXPRESS
      - INTERNATIONAL_STANDARD
      - INTERNATIONAL_EXPEDITED
      - FREIGHT
      - DOWNLOAD
      - PALLET_DELIVERY
      - PICKUP
      - SAME_DAY
      - ECONOMY
      - HAZMAT
      - TEMPERATURE_CONTROLLED
      - FREE_SHIPPING
      - FLAT_RATE
      - TABLE_RATE
      - CURBSIDE_PICKUP
      - LOCKER_DELIVERY
      - ECO_FRIENDLY
      - HYBRID_SHIPPING
      - AIR_FREIGHT
      - OCEAN_FREIGHT
      - RAIL_FREIGHT
    TimeSlot:
      type: object
      properties:
        time_slot_key:
          maxLength: 50
          minLength: 1
          type: string
          description: Unique surrogate key for the specific time slot instance.
          example: TS-KEY-99281A
        end_day:
          $ref: "#/components/schemas/DayOfWeekTypes"
        end_time:
          maxLength: 8
          minLength: 5
          pattern: "^([01]\\d|2[0-3]):([0-5]\\d):([0-5]\\d)$"
          type: string
          description: Time with format of HH:mm:ss
          example: "52200"
        recurring_indicator:
          type: boolean
          description: Indicates whether the time slot repeats on a recurring cycle.
          example: true
        recurring_period:
          $ref: "#/components/schemas/EffectivePeriod"
        start_day:
          $ref: "#/components/schemas/DayOfWeekTypes"
        start_time:
          maxLength: 8
          minLength: 5
          pattern: "^([01]\\d|2[0-3]):([0-5]\\d):([0-5]\\d)$"
          type: string
          description: Time with format of HH:mm:ss
          example: "52200"
        timeslot_directive_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/TimeslotDirectiveTypes"
        time_slot_id:
          maxLength: 36
          minLength: 1
          type: string
          description: The business identifier or code assigned to this generic time
            block configuration.
          example: MORNING_SHIFT_01
        week_of_date:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          format: date
          items:
            type: string
        timeslot_status_type:
          $ref: "#/components/schemas/TimeSlotStatusTypes"
      description: Range of time for the appointment
    TimeSlotStatusTypes:
      type: string
      description: types of time slot status.
      enum:
      - TENTATIVE
      - RESERVED
      - CONFIRMED
      - RELEASED
    TimeSlots:
      type: array
      items:
        $ref: "#/components/schemas/TimeSlot"
    TimeslotDirectiveTypes:
      type: string
      description: types of timeslot directives.
      enum:
      - AFTER
      - ANYTIME
      - BEFORE
      - BETWEEN
      - BLOCK
      - EXACT
      - FLEXIBLE
      - PREFERRED
      - REQUIRED
      - RESTRICTED
      - OTHER
      - UNKNOWN
    TrackingInformation:
      type: object
      properties:
        tracking_information_key:
          type: string
          description: Unique key identifying this specific tracking information entry.
          example: track_info_abc123
        tracking_information_id:
          type: string
          description: "Identifier for this specific tracking information entry, often\
            \ an external ID from the carrier."
          example: TRACK-UPDATE-20250812-001
        tracking_number:
          type: string
          description: The unique tracking number provided by the carrier.
          example: 1Z9999999999999999
        tracking_date_time:
          type: string
          description: Date and time when this specific tracking update was recorded.
          format: date-time
          example: 2026-07-27T15:56:11Z
        shipment_state_type:
          $ref: "#/components/schemas/ShipmentStateTypes"
        status_description:
          type: string
          description: A human-readable description of the tracking status.
          example: Package is currently in transit to destination facility.
        current_location:
          $ref: "#/components/schemas/Position"
        shipment_events:
          $ref: "#/components/schemas/ShipmentEvents"
        notes:
          type: string
          description: Any additional notes related to this specific tracking update.
          example: Weather delay in Kansas City.
        carrier_name:
          maxLength: 120
          minLength: 1
          type: string
          description: The shipping carrier name associated with the tracking information.
          example: UPS
        carrier_tracking_url:
          maxLength: 2000
          minLength: 1
          type: string
          description: The carrier-provided URL used to track the shipment.
          example: https://wwwapps.ups.com/WebTracking/track?track=yes&trackNums=1Z999AA99999999999
        estimated_delivery_date_time:
          type: string
          description: The estimated delivery timestamp provided by the carrier or
            logistics provider.
          format: date-time
          example: 2026-07-27T15:56:11Z
        actual_delivery_date_time:
          type: string
          description: The actual delivery timestamp confirmed by the carrier or recipient.
          format: date-time
          example: 2026-07-27T15:56:11Z
        last_updated_date_time:
          type: string
          description: The timestamp documenting the most recent tracking update received
            from the carrier or logistics platform.
          format: date-time
          example: 2026-07-27T15:56:11Z
        delivery_exception_indicator:
          type: boolean
          description: "Indicates whether the shipment encountered a delivery exception,\
            \ delay, or operational issue."
          example: false
        exception_reason:
          maxLength: 500
          minLength: 1
          type: string
          description: The carrier-provided reason associated with the shipment delivery
            exception.
          example: WEATHER_DELAY
        previous_shipment_state_type:
          $ref: "#/components/schemas/ShipmentStateTypes"
        event_source:
          maxLength: 120
          minLength: 1
          type: string
          description: "The carrier, logistics provider, platform, or system that\
            \ generated the tracking update."
          example: UPS
        event_sequence_num:
          maxLength: 20
          minLength: 1
          type: string
          description: The chronological sequence number associated with the tracking
            update.
          example: "14"
        exception_severity_type:
          $ref: "#/components/schemas/ExceptionSeverityTypes"
        tracking_information_codes:
          $ref: "#/components/schemas/Codes"
        transit_duration_seconds:
          type: integer
          description: The total shipment transit duration in seconds between shipment
            initiation and delivery or the current tracking milestone.
          format: int64
          example: 86400
      description: Details capturing tracking milestones and estimated delivery information
        for a shipment related to a receipt.
    TrackingInformations:
      type: array
      items:
        $ref: "#/components/schemas/TrackingInformation"
