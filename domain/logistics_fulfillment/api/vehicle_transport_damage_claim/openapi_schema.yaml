    VehicleTransferItemReference:
      type: object
      properties:
        vehicle_transfer_item_key:
          type: string
          description: Unique business key identifying the referenced vehicle transfer
            item within the transportation domain.
          example: VTI-2026-000145-01
        vehicle_transfer_item_id:
          type: string
          description: System-generated identifier associated with the referenced
            vehicle transfer item.
          example: "987654321"
        vehicle_reference:
          $ref: "#/components/schemas/VehicleReference"
        transport_group_key:
          type: string
          description: Logical grouping key associating the referenced vehicle transfer
            item with other items sharing transportation grouping requirements. The
            grouping policy determines whether transportation together is mandatory
            or preferred.
          example: TG-2026-000145-01
        identifiers:
          $ref: "#/components/schemas/Identifiers"
      description: "Reference identifying an individual vehicle transfer item, including\
        \ its business key, system identifier, vehicle reference, transportation grouping\
        \ key, and external identifiers. Used to associate transportation activities,\
        \ trip steps, shipments, and other operational records with the originating\
        \ vehicle transfer item."
    VehicleTransportDamageClaim:
      type: object
      properties:
        damage_claim_key:
          type: string
          description: Unique transportation damage claim identifier.
          example: DCLM-2026-001
        damage_claim_id:
          type: string
          description: External or insurer claim identifier.
          example: CLM-88421
        vehicle_transfer_item_reference:
          $ref: "#/components/schemas/VehicleTransferItemReference"
        vehicle_trip_step_key:
          type: string
          description: Identifier of the associated VehicleTripStep.
