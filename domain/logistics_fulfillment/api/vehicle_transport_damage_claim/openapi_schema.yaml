        shipment_references:
          $ref: "#/components/schemas/ShipmentReferences"
        delivery_exception_key:
          type: string
          description: Related VehicleDeliveryException identifier.
          example: DEX-2026-001
        custody_transfer_key:
          type: string
          description: Related VehicleCustodyTransfer identifier.
          example: CUST-2026-001
        damage_discovery_date_time:
          type: string
          description: When damage was discovered in ISO 8601 format.
          format: date-time
          example: 2026-11-17T15:05:00-05:00
        claim_submission_date_time:
          type: string
          description: When claim was submitted in ISO 8601 format.
          format: date-time
          example: 2026-11-18T09:00:00-05:00
        claim_status_type:
          type: string
          description: "Claim status such as DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED,\
            \ DENIED, or SETTLED."
          example: SUBMITTED
        damage_type:
          type: string
          description: "Damage category such as BODY, GLASS, MECHANICAL, or INTERIOR."
          example: BODY
        claimant_party_reference:
          $ref: "#/components/schemas/PartyReference"
        responsible_party_reference:
          $ref: "#/components/schemas/PartyReference"
        claimed_amount:
          $ref: "#/components/schemas/GeneralAmount"
        approved_amount:
          $ref: "#/components/schemas/GeneralAmount"
        recovered_amount:
          $ref: "#/components/schemas/GeneralAmount"
        settlement_date_time:
          type: string
          description: Date and time of claim settlement in ISO 8601 format.
          format: date-time
          example: 2026-12-01T12:00:00-05:00
        medias:
          $ref: "#/components/schemas/Medias"
        comments:
          type: string
          description: Claim investigation and settlement notes.
          example: New bumper damage documented at delivery.
