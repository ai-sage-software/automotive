          type: string
          description: The calculated driver score associated with this trip.
          example: "87"
        partial_indicator:
          type: boolean
          description: "Indicates whether the trip record is partial, incomplete,\
            \ or missing expected event data."
          example: false
        trip_distance:
          $ref: "#/components/schemas/MetricValue"
        trip_duration:
          $ref: "#/components/schemas/EffectivePeriod"
