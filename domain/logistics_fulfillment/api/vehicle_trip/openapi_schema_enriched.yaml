          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/TripStatusEvent"
        start:
          $ref: "#/components/schemas/VehicleSnapshot"
        end:
          $ref: "#/components/schemas/VehicleSnapshot"
        start_date_time:
          type: string
          description: The timestamp when the trip started.
          format: date-time
          example: 2026-10-19T08:56:49Z
        end_date_time:
          type: string
          description: The timestamp when the trip ended.
          format: date-time
          example: 2026-10-19T08:56:49Z
        start_position:
          $ref: "#/components/schemas/Position"
        end_position:
          $ref: "#/components/schemas/Position"
        vehicle_states:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/VehicleState"
