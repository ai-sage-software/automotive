          description: The immutable identifier representing the vehicle trip aggregate.
          example: VTRIP-882211
        vehicle_trip_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external or provider-generated vehicle trip identifier.
          example: TRIP-2026-000991
