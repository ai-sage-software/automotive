          maxLength: 60
          minLength: 1
          type: string
          description: The assignment key under which the trip was executed.
          example: VASSIGN-882211
        account_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The account key associated with the trip.
          example: ACCOUNT-4401
        fleet_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The fleet key associated with the trip.
          example: FLEET-1001
        fleet_item_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The fleet item key associated with the trip.
          example: FLEETITEM-2211
        schedule_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The schedule key associated with the planned or dispatched
            trip.
          example: SCHED-44391
        vehicle_reference:
          $ref: "#/components/schemas/VehicleReference"
        driver_references:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/PartyReference"
        fleet_reference:
          $ref: "#/components/schemas/FleetReference"
        trip_status_type:
          $ref: "#/components/schemas/TripStatusTypes"
        trip_stage_type:
          $ref: "#/components/schemas/TripStageTypes"
