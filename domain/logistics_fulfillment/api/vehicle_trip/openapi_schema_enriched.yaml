          maxLength: 80
          minLength: 1
          type: string
          description: The business or operational purpose of the trip.
          example: FIELD_SERVICE
        trip_notes:
          maxLength: 4000
          minLength: 1
          type: string
          description: "Operational notes, exceptions, or comments associated with\
