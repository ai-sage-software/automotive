openapi: 3.0.1
info:
  title: Automotive Retail Systems API - LoyaltyAccount
  description: "A standardized interface for Automotive Retail operations, built upon\
    \ a formal Retail Ontology. It enables seamless integration \n\n**Key Capabilities:**\n\
    * **Catalog Management:** Unified definitions for parts, assemblies, and BOMs.\n\
    * **Inventory Orchestration:** Real-time visibility into warehouse and dealership\
    \ stock.\n* **Financial Workflows:** Automated invoicing and batch processing\
    \ for high-volume retail transactions.\n\nDesigned for high-reliability CI/CD\
    \ environments and asynchronous batch processing."
  contact:
    name: STAR Standards Platform Architecture
    url: https://www.starstandard.org
    email: architecture@starstandard.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://api.starstandard.org/v1
  description: Production server
- url: https://sandbox.starstandard.org/v1
  description: Sandbox for testing
paths: {}
components:
  schemas:
    Code:
      type: object
      properties:
        code_id:
          maxLength: 50
          minLength: 5
          type: string
          description: Internal system-generated unique identifier for the code record.
          example: cd-9902-v1
        code_key:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique business reference key used to identify the code's context.
          example: VEHICLE_STATUS_CODE
        code_context:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique business reference key used to identify the code's context.
          example: VEHICLE_STATUS_CODE
        code:
          maxLength: 50
          minLength: 1
          type: string
          description: The literal value or mnemonic represented by this record.
          example: IN_TRANSIT
        description:
          maxLength: 255
          minLength: 5
          type: string
          description: A human-readable explanation of what the code represents.
          example: Indicates the vehicle has left the factory but not yet arrived
            at the dealer.
      description: not nullable
    Codes:
      type: array
      items:
        $ref: "#/components/schemas/Code"
    LoyaltyAccount:
      type: object
      properties:
        loyalty_account_id:
          type: string
          description: Unique identifier for the loyalty account
          example: LA-10001
        loyalty_account_key:
          type: string
          description: Stable business key for the loyalty account
          example: LOYALTY-ACCOUNT-10001
        loyalty_program_key:
          type: string
          description: Business key of the loyalty program governing the account
          example: LOYALTY-PROGRAM-001
        customer_reference_key:
          type: string
          description: Business key of the enrolled customer
          example: CUSTOMER-10001
        account_status_type:
          type: string
          description: Current status of the loyalty account
          example: ACTIVE
        membership_number:
          type: string
          description: Member-facing loyalty membership number
          example: MEM-12345678
        current_tier_code:
          type: string
          description: Current membership tier code
          example: GOLD
        points_balance:
          $ref: "#/components/schemas/MetricNameValue"
        enrollment_date_time:
          type: string
          description: Date and time the customer enrolled in the program
          format: date-time
          example: 2026-11-15T22:45:25Z
        loyalty_transactions:
          $ref: "#/components/schemas/LoyaltyTransactions"
      description: LoyaltyAccount domain entity.
    LoyaltyAccountCreate:
      required:
      - loyalty_account_key
      type: object
      description: LoyaltyAccount Create for Post
      allOf:
      - $ref: "#/components/schemas/LoyaltyAccount"
    LoyaltyAccountUpdate:
      type: object
      properties:
        membership_number:
          type: string
          description: Member-facing loyalty membership number
          example: MEM-12345678
        loyalty_transactions:
          $ref: "#/components/schemas/LoyaltyTransactions"
        current_tier_code:
          type: string
          description: Current membership tier code
          example: GOLD
        points_balance:
          $ref: "#/components/schemas/MetricNameValue"
        enrollment_date_time:
          type: string
          description: Date and time the customer enrolled in the program
          format: date-time
          example: 2026-11-15T22:45:25Z
        account_status_type:
          type: string
          description: Current status of the loyalty account
          example: ACTIVE
      description: LoyaltyAccount Update for Patch and Put
    LoyaltyTransaction:
      type: object
      properties:
        loyalty_transaction_id:
          type: string
          description: Unique identifier for the loyalty transaction
          example: LTX-10001
        loyalty_transaction_key:
          type: string
          description: Stable business key for the loyalty transaction
          example: LOYALTY-TXN-2026-001
        loyalty_account_key:
          type: string
          description: Business key of the loyalty account receiving the transaction
          example: LOYALTY-ACCOUNT-10001
        transaction_type:
          type: string
          description: Classification of loyalty value movement
          example: EARN
        transaction_status_type:
          type: string
          description: Processing status of the loyalty transaction
          example: POSTED
        points_change:
          $ref: "#/components/schemas/MetricNameValue"
        transaction_date_time:
          type: string
          description: Effective date and time of the loyalty transaction
          format: date-time
          example: 2026-11-15T22:45:25Z
        source_reference_key:
          type: string
          description: "Business key of the source purchase, service event, or adjustment"
          example: INVOICE-2026-10001
        idempotency_key:
          type: string
          description: Provider-scoped key preventing duplicate application of the
            same transaction
          example: LOYALTY-EVENT-10001
      description: LoyaltyTransaction domain entity.
    LoyaltyTransactions:
      type: array
      items:
        $ref: "#/components/schemas/LoyaltyTransaction"
    MetricNameValue:
      type: object
      properties:
        metric_name_value_key:
          type: string
          description: A unique key for the metric name value record.
        metric_name_value_id:
          type: string
          description: The unique ID for the metric name value.
        header_sequence:
          type: string
          description: The header sequence for the metric value.
        uom:
          $ref: "#/components/schemas/NarrativeUomTypes"
        value:
          type: string
          description: The value of the metric.
        value_category:
          type: string
          description: The category of the metric value.
        value_description:
          type: string
          description: A description of the metric value.
        value_name:
          type: string
          description: The name of the metric value.
        codes:
          $ref: "#/components/schemas/Codes"
      description: A metric value with a name and unit of measure.
    NarrativeUomTypes:
      type: string
      description: types of narrative uoms.
      enum:
      - BAR
      - KPA
      - PSI
      - OZ
      - LB
      - KG
      - GRAMS
      - TONS
      - LITER
      - GALLON
      - FLUID_OUNCE
      - CUBIC_METER
