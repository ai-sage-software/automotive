openapi: 3.0.1
info:
  title: Automotive Retail Systems API - MarketingCampaign
  description: "A standardized interface for Automotive Retail operations, built upon\
    \ a formal Retail Ontology. It enables seamless integration \n\n**Key Capabilities:**\n\
    * **Catalog Management:** Unified definitions for parts, assemblies, and BOMs.\n\
    * **Inventory Orchestration:** Real-time visibility into warehouse and dealership\
    \ stock.\n* **Financial Workflows:** Automated invoicing and batch processing\
    \ for high-volume retail transactions.\n\nDesigned for high-reliability CI/CD\
    \ environments and asynchronous batch processing."
  contact:
    name: STAR Standards Platform Architecture
    url: https://www.starstandard.org
    email: architecture@starstandard.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://api.starstandard.org/v1
  description: Production server
- url: https://sandbox.starstandard.org/v1
  description: Sandbox for testing
paths: {}
components:
  schemas:
    CertificateRedemptionStatusTypes:
      type: string
      description: types of certificate redemption status.
      enum:
      - INITIATE
      - PROCESSING
      - ACTIVE
      - COMPLETE
    Code:
      type: object
      properties:
        code_id:
          maxLength: 50
          minLength: 5
          type: string
          description: Internal system-generated unique identifier for the code record.
          example: cd-9902-v1
        code_key:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique business reference key used to identify the code's context.
          example: VEHICLE_STATUS_CODE
        code_context:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique business reference key used to identify the code's context.
          example: VEHICLE_STATUS_CODE
        code:
          maxLength: 50
          minLength: 1
          type: string
          description: The literal value or mnemonic represented by this record.
          example: IN_TRANSIT
        description:
          maxLength: 255
          minLength: 5
          type: string
          description: A human-readable explanation of what the code represents.
          example: Indicates the vehicle has left the factory but not yet arrived
            at the dealer.
      description: not nullable
    Codes:
      type: array
      items:
        $ref: "#/components/schemas/Code"
    CommunicationChannelTypes:
      type: string
      description: types of communication channels.
      enum:
      - PHONE
      - CELL
      - SMS
      - VOICE
      - VIDEO
      - EMAIL
      - APP
      - SOCIAL_MEDIA
      - URL
      - BROADCAST
      - DIRECT_MAIL
      - PDA
      - OTHER
    Descriptor:
      type: object
      properties:
        descriptor_key:
          type: string
          description: The unique key for the descriptor record.
        descriptor_name:
          type: string
          description: The name of the descriptor.
        descriptor_value:
          type: string
          description: The value of the descriptor.
        descriptor_category:
          type: string
          description: The category of the descriptor.
        descriptor_handle:
          type: string
          description: The handle or short code for the descriptor.
        descriptor_sequence:
          type: string
          description: The sequence number of the descriptor.
        descriptor_sub_categories:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
      description: "Represents a descriptor, providing categorized and named values\
        \ for various entities."
    Descriptors:
      type: array
      items:
        $ref: "#/components/schemas/Descriptor"
    DurationUomTypes:
      type: string
      description: types of duration uoms.
      enum:
      - MINUTES
      - HOURS
      - DAYS
      - DAY_OF_MONTH
      - WEEKS
      - BI_WEEKS
      - SEMI_MONTHS
      - MONTHS
      - QUARTERS
      - SEMI_YEARS
      - YEARS
      - MULTI_YEARS
      - CUSTOM
      - OCCURRENCE
      - UNLIMITED
      - NONE
      - OTHER
    EffectivePeriod:
      type: object
      properties:
        effective_period_key:
          type: string
          description: Unique natural business key identifying the effective period
            record.
          example: EP-2024-REG-001
        active_indicator:
          type: boolean
          description: Indicates if this period is currently considered valid and
            enforceable within the domain.
          example: true
        exclusive_indicator:
          type: boolean
          description: "If true, this period represents the only valid time window,\
            \ overriding overlapping periods."
          example: false
        start_date_time:
          type: string
          description: The inclusive start point of the period in ISO 8601 format.
          format: date-time
          example: 2026-11-15T22:44:25Z
        complete_date_time:
          type: string
          description: The exclusive end point of the period (completion) in ISO 8601
            format.
          format: date-time
          example: 2026-11-15T22:44:25Z
        duration_uom_type:
          $ref: "#/components/schemas/DurationUomTypes"
        duration_value:
          pattern: ^P(?!$)((\d+Y)?(\d+M)?(\d+W)?(\d+D)?)(T(?=\d)(\d+H)?(\d+M)?(\d+S)?)?$
          type: string
          description: The length of the period expressed in ISO 8601 duration format.
          example: P1Y2M10D
        recur_uom_type:
          $ref: "#/components/schemas/DurationUomTypes"
        recur_count:
          type: string
          description: Number of times the period repeats. Use -1 for infinite.
          example: "12"
        recur_values:
          $ref: "#/components/schemas/Codes"
        recur_criteria:
          type: string
          description: Natural language or DSL expression of complex recurrence logic.
          example: Every last Friday of the month
        recur_indicator:
          type: boolean
          description: Flag indicating if this period repeats based on the defined
            criteria.
          example: true
      description: "Defines a temporal range and recurrence logic for business validity,\
        \ such as license expirations or service intervals."
    MarketingAffiliate:
      type: object
      properties:
        marketing_affiliate_key:
          type: string
          description: The unique key for the marketing affiliate.
        verified_indicator:
          type: boolean
          description: A boolean indicator of whether the affiliate has been verified.
          example: false
        marketing_offer_type:
          $ref: "#/components/schemas/MarketingAffiliateTypes"
        notes:
          $ref: "#/components/schemas/Memo"
        affiliate_descriptors:
          $ref: "#/components/schemas/Descriptors"
        marketing_offer_categories:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        marketing_offers_href:
          type: string
          description: A hyper-reference to the marketing offers.
          format: href
      description: "Represents a marketing affiliate and their associated offers,\
        \ including descriptors, categories, and verification status."
    MarketingAffiliateTypes:
      type: string
      description: types of marketing affiliates.
      enum:
      - VEHICLE
      - DEALER
      - LOCATION
      - MILITARY
      - GOVERNMENT
      - RESPONDER
      - STUDENT
      - ALUMNI
      - TEACHER
      - EMPLOYEE
      - NURSE
      - MEDICAL
      - OTHER
    MarketingAffiliates:
      type: array
      items:
        $ref: "#/components/schemas/MarketingAffiliate"
    MarketingCampaign:
      type: object
      properties:
        marketing_campaign_key:
          type: string
          description: The unique key for the marketing campaign record.
        campaign_id:
          type: string
          description: The unique ID for the campaign.
        marketing_id:
          type: string
          description: The unique ID for the marketing initiative.
        program_id:
          type: string
          description: The unique ID for the program.
        program_name:
          type: string
          description: The name of the marketing program.
        program_marketing_name:
          type: string
          description: The marketing name of the program.
        program_distributor_name:
          type: string
          description: The name of the program's distributor.
        program_code:
          type: string
          description: The code associated with the program.
        program_description:
          type: string
          description: A description of the program.
        program_duration:
          $ref: "#/components/schemas/EffectivePeriod"
        announcement_code:
          type: string
          description: The code for the announcement.
        announcement_date_time:
          type: string
          description: The date and time of the announcement.
          format: date-time
          example: 2026-11-15T22:44:25Z
        program_certificates:
          $ref: "#/components/schemas/ProgramCertificates"
        program_offer_descs:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        program_values:
          $ref: "#/components/schemas/MetricNameValues"
        target_markets:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        communication_channel_types:
          $ref: "#/components/schemas/CommunicationChannelTypes"
        marketing_channel_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/MarketingChannelTypes"
        opportunity_profiles:
          $ref: "#/components/schemas/Codes"
        marketing_affiliates:
          $ref: "#/components/schemas/MarketingAffiliates"
        program_guidelines:
          $ref: "#/components/schemas/Codes"
        sales_activities_href:
          type: string
          description: The URI to the sales activities resource.
          format: href
        program_key:
          type: string
          description: Business key of the program promoted by this campaign
          example: PROGRAM-LOYALTY-2026
        campaign_name:
          type: string
          description: Name of the campaign execution
          example: November Loyalty Outreach
        campaign_description:
          type: string
          description: Purpose and execution details of the marketing campaign
          example: Email and dealer outreach to eligible loyalty customers
        campaign_effective_period:
          $ref: "#/components/schemas/EffectivePeriod"
        customer_segment_keys:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        marketing_lead_keys:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
      description: "Represents a marketing campaign, including its details, channels,\
        \ and targets."
    MarketingCampaignCreate:
      required:
      - marketing_campaign_key
      type: object
      description: MarketingCampaign Create for Post
      allOf:
      - $ref: "#/components/schemas/MarketingCampaign"
    MarketingCampaignUpdate:
      type: object
      properties:
        opportunity_profiles:
          $ref: "#/components/schemas/Codes"
        program_description:
          type: string
          description: A description of the program.
        program_certificates:
          $ref: "#/components/schemas/ProgramCertificates"
        announcement_code:
          type: string
          description: The code for the announcement.
        marketing_lead_keys:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        communication_channel_types:
          $ref: "#/components/schemas/CommunicationChannelTypes"
        program_name:
          type: string
          description: The name of the marketing program.
        program_offer_descs:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        campaign_description:
          type: string
          description: Purpose and execution details of the marketing campaign
          example: Email and dealer outreach to eligible loyalty customers
        program_marketing_name:
          type: string
          description: The marketing name of the program.
        campaign_name:
          type: string
          description: Name of the campaign execution
          example: November Loyalty Outreach
        program_distributor_name:
          type: string
          description: The name of the program's distributor.
        customer_segment_keys:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        announcement_date_time:
          type: string
          description: The date and time of the announcement.
          format: date-time
          example: 2026-11-15T22:44:25Z
        program_code:
          type: string
          description: The code associated with the program.
        program_duration:
          $ref: "#/components/schemas/EffectivePeriod"
        marketing_channel_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/MarketingChannelTypes"
        program_guidelines:
          $ref: "#/components/schemas/Codes"
        campaign_effective_period:
          $ref: "#/components/schemas/EffectivePeriod"
        sales_activities_href:
          type: string
          description: The URI to the sales activities resource.
          format: href
        target_markets:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: string
        program_values:
          $ref: "#/components/schemas/MetricNameValues"
        marketing_affiliates:
          $ref: "#/components/schemas/MarketingAffiliates"
      description: MarketingCampaign Update for Patch and Put
    MarketingChannelTypes:
      type: string
      description: types of marketing channels.
      enum:
      - ALL
      - WHOLESALE
      - DIRECT_DISTRIBUTORS
      - DIRECT_INTERNET
      - DIRECT_CATALOGUE
      - SALES_TEAM
      - VALUE_ADD_RESELLER
      - CONSULTANT
      - RETAIL_SALES_AGENT
      - OEM_REPRESENTATIVE
      - OTHER
    Memo:
      type: array
      items:
        type: string
    MetricNameValue:
      type: object
      properties:
        metric_name_value_key:
          type: string
          description: A unique key for the metric name value record.
        metric_name_value_id:
          type: string
          description: The unique ID for the metric name value.
        header_sequence:
          type: string
          description: The header sequence for the metric value.
        uom:
          $ref: "#/components/schemas/NarrativeUomTypes"
        value:
          type: string
          description: The value of the metric.
        value_category:
          type: string
          description: The category of the metric value.
        value_description:
          type: string
          description: A description of the metric value.
        value_name:
          type: string
          description: The name of the metric value.
        codes:
          $ref: "#/components/schemas/Codes"
      description: A metric value with a name and unit of measure.
    MetricNameValues:
      type: array
      items:
        $ref: "#/components/schemas/MetricNameValue"
    NarrativeUomTypes:
      type: string
      description: types of narrative uoms.
      enum:
      - BAR
      - KPA
      - PSI
      - OZ
      - LB
      - KG
      - GRAMS
      - TONS
      - LITER
      - GALLON
      - FLUID_OUNCE
      - CUBIC_METER
      - KM
      - MILES
      - MI
      - INCH
      - FEET
      - YARD
      - FATHOM
      - NAUTICAL
      - METER
      - CENTIMETER
      - MILLIMETER
      - DURATION
      - SECONDS
      - MINUTES
      - HOURS
      - DAYS
      - WEEKS
      - DAY_OF_MONTH
      - BI_WEEKS
      - SEMI_MONTHS
      - MONTHS
      - QUARTERS
      - SEMI_YEARS
      - YEARS
      - MULTI_YEARS
      - DATE_TIME
      - DATE
      - TIME
      - CELSIUS
      - FAHRENHEIT
      - KELVIN
      - RANKINE
      - VOLT
      - AMPERE
      - OHM
      - WATT
      - KILOWATT_HOUR
      - HP
      - RPM
      - G_FORCE
      - DEGREES
      - OCCURRENCE
      - GROUP
      - CODE
      - CURRENCY
      - POINTS
      - CUSTOM
      - UNLIMITED
      - NONE
      - LABEL
      - PERCENT
      - DESC
      - TEXT
      - KEY
      - PROTECTED_TEXT
      - BINARY
      - STRING
      - NUMBER
      - INTEGER
      - BOOLEAN
      - ARRAY
      - OBJECT
      - FLOAT
      - DOUBLE
      - INT32
      - INT64
      - COUNT
      - RATIO
      - SCORE
      - OTHER
    ProgramCertificate:
      type: object
      properties:
        program_certificate_key:
          type: string
          description: The unique key for the program certificate record.
        certificate_id:
          type: string
          description: The unique ID for the certificate.
        certificate_code:
          type: string
          description: The unique code for the certificate.
        certificate_name:
          type: string
          description: The name of the certificate.
        certificate_value:
          type: string
          description: The value of the certificate.
        certificate_value_uom:
          type: string
          description: The unit of measure for the certificate's value.
        certificate_redemption_status_type:
          $ref: "#/components/schemas/CertificateRedemptionStatusTypes"
        offer_certificate_duration:
          $ref: "#/components/schemas/EffectivePeriod"
        certificate_description:
          type: string
          description: A description of the certificate.
      description: "Represents a marketing program certificate, including its value,\
        \ status, and duration."
    ProgramCertificates:
      type: array
      items:
        $ref: "#/components/schemas/ProgramCertificate"
