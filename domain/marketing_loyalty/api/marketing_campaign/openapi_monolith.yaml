  description: Tag Description Descriptors
- name: Health
  description: Tag Description Health
- name: MarketingAffiliates
  description: Tag Description MarketingAffiliates
- name: MarketingCampaigns
  description: Tag Description MarketingCampaigns
- name: ProgramCertificates
