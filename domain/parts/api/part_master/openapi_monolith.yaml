        \ and specifications."
    PartMasterRegulatory:
      type: object
      properties:
        part_master_regulatory_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "870747648343146541"
        part_master_regulatory_key:
          type: string
          description: Unique global internal or external business key.
          example: "870747648343146542"
        is_hazardous:
          type: boolean
          description: Indicates if the part is classified as hazardous material.
          example: true
        is_environmental_regulated:
          type: boolean
          description: Indicates if the part is subject to environmental regulations.
          example: false
        export_control_class_number:
          pattern: "^[0-9A-Z]{5}$"
          type: string
          description: Export control classification number (ECCN) if applicable.
          example: 3A001
        hazard_class_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: hazard_class_types list
          example:
          - TOXIC_INFECTIOUS_SUBSTANCES
          items:
            $ref: "#/components/schemas/HazardClassTypes"
        un_na_number:
          maxLength: 6
          minLength: 6
          pattern: "^(UN|NA)\\d{4}$"
          type: string
          description: UN/NA number assigned to hazardous materials.
          example: UN1230
        packing_group:
          maxLength: 3
          minLength: 1
          pattern: ^(I|II|III)$
          type: string
          description: "Packing group indicating degree of danger (I, II, III)."
          example: II
        sds_version:
          type: string
          description: Version or date of the Safety Data Sheet (SDS).
          example: "2.1"
        sds_external_link:
          pattern: "^(https?|ftp)://[-a-zA-Z0-9+&@#/%?=~_|!:,.;]*[-a-zA-Z0-9+&@#/%=~_|]"
          type: string
          description: URL link to external Safety Data Sheet (SDS).
          example: https://example-sds.com/docs/123
        applicable_regulations:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: List of regulatory standards or compliance requirements applicable
            to the part.
          example:
          - "870747138219311142"
          - "870747138219311143"
          items:
            type: string
        regulatory_notes:
          type: string
          description: Additional notes regarding regulatory compliance.
          example: Ensure proper ventilation during handling.
        part_hazard_packing_group_type:
          $ref: "#/components/schemas/PartHazardPackingGroupTypes"
      description: Part Master and Regulatory Information
