- name: JurisdictionProfiles
  description: Tag Description JurisdictionProfiles
- name: PrivacyPolicyRules
  description: Tag Description PrivacyPolicyRules
- name: ReferenceValues
  description: Tag Description ReferenceValues
- name: StatusTransitionEvents
  description: Tag Description StatusTransitionEvents
