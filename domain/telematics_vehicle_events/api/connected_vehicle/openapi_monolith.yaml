components:
  schemas:
    ActorReference:
      type: object
      properties:
        actor_reference_id:
          type: string
          description: Unique system identifier for the reference record itself.
          example: pr-8821-x01
        actor_reference_key:
          type: string
          description: "Business-logical key for the reference, often combining the\
            \ event and actor context."
          example: REF-SALE-2026-CUST-99
        actor_key:
          type: string
          description: The business key of the actual Actor (Person or Org) being
            referenced.
          example: CUST-DEALER-4412
        actor_name:
          type: string
          description: The formal display name of the Actor at the time of reference.
          example: Northside Chevrolet Service Center
        actor_type:
          $ref: "#/components/schemas/ActorTypes"
        privacy_policy_rules:
          $ref: "#/components/schemas/PrivacyPolicyRules"
        occurrence_date_time:
          type: string
          description: Timestamp indicating when this specific reference was established.
          format: date-time
          example: 2026-07-24T01:33:38Z
      description: External system identifier
    ActorTypes:
      type: string
      description: types of actors.
      enum:
      - USER
      - CUSTOMER
      - EMPLOYEE
      - DEALER
      - VENDOR
      - SUPPLIER
      - ORGANIZATION
      - SYSTEM
      - SERVICE
      - APPLICATION
      - API
      - AGENT
      - AI_AGENT
      - WORKFLOW
      - RULE_ENGINE
      - DEVICE
      - SENSOR
      - PARTNER
      - CONTRACTOR
      - GOVERNMENT
      - PROCESS
      - SCHEDULER
      - EVENT_HANDLER
      - UNKNOWN
    AlertStatusTypes:
      type: string
      description: types of alert status.
      enum:
      - ACTIVE
      - ACKNOWLEDGED
      - IN_PROGRESS
      - RESOLVED
      - CLOSED
      - EXPIRED
      - CANCELLED
      - UNKNOWN
    Code:
      type: object
      properties:
        code_id:
          maxLength: 50
          minLength: 5
          type: string
          description: Internal system-generated unique identifier for the code record.
          example: cd-9902-v1
        code_key:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique business reference key used to identify the code's context.
          example: VEHICLE_STATUS_CODE
        code:
          maxLength: 50
          minLength: 1
          type: string
          description: The literal value or mnemonic represented by this record.
          example: IN_TRANSIT
        description:
          maxLength: 255
          minLength: 5
          type: string
          description: A human-readable explanation of what the code represents.
          example: Indicates the vehicle has left the factory but not yet arrived
            at the dealer.
      description: not nullable
    Codes:
      type: array
      items:
        $ref: "#/components/schemas/Code"
    ConnectedVehicle:
      type: object
      properties:
        connected_vehicle_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable aggregate root identifier representing the connected
            vehicle digital twin.
          example: CV-998211
        connected_vehicle_id:
          maxLength: 60
          minLength: 1
          type: string
          description: The external or source-system identifier for the connected
            vehicle digital twin.
          example: CV-2026-000448
        vehicle_reference:
          $ref: "#/components/schemas/VehicleReference"
        vehicle_identifier_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The canonical vehicle identity anchor key used to associate
            this aggregate with the enterprise vehicle identity registry.
          example: VID-00088211
        identity_anchor_key:
          maxLength: 80
          minLength: 1
          type: string
          description: The immutable identity anchor linking connected services to
            the enterprise vehicle identity.
          example: VIN-1FT8W3BT6SEC12345
        connected_platform_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external OEM or telematics platform identifier associated
            with the connected vehicle ecosystem.
          example: FORDPASS-883991
        connected_provider:
          maxLength: 80
          minLength: 1
          type: string
          description: "The OEM, telematics, or third-party provider responsible for\
            \ connected vehicle data delivery."
          example: FordPass
        connected_status_type:
          $ref: "#/components/schemas/ConnectedVehicleStatusTypes"
        last_heartbeat_date_time:
          type: string
          description: The timestamp documenting the most recent successful communication
            received from the connected vehicle.
          format: date-time
          example: 2026-07-24T01:33:38Z
        current_odometer:
          $ref: "#/components/schemas/MetricValue"
        current_position:
          $ref: "#/components/schemas/Position"
        vehicle_signal_states:
          $ref: "#/components/schemas/VehicleSignalStates"
        fuel_level:
          $ref: "#/components/schemas/MetricValue"
        battery_state_of_charge:
          $ref: "#/components/schemas/MetricValue"
        ignition_status_type:
          $ref: "#/components/schemas/IgnitionStatusTypes"
        connected_alerts:
          $ref: "#/components/schemas/ConnectedVehicleAlerts"
        latest_telemetry_event_reference:
          $ref: "#/components/schemas/VehicleTelemetryEventReference"
        remote_start_status_type:
          $ref: "#/components/schemas/RemoteStartStatusTypes"
        software_version:
          maxLength: 80
          minLength: 1
          type: string
          description: The currently installed connected vehicle software or firmware
            version.
          example: SYNC-6.2.1
        over_the_air_update_status_type:
          $ref: "#/components/schemas/OverTheAirUpdateStatusTypes"
        connected_subscriptions:
          $ref: "#/components/schemas/SubscriptionReferences"
        data_sharing_consent_indicator:
          type: boolean
          description: Indicates whether the vehicle owner or controlling party has
            authorized connected vehicle data sharing.
          example: true
        privacy_codes:
          $ref: "#/components/schemas/Codes"
        governance_codes:
          $ref: "#/components/schemas/Codes"
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: The source system that supplied or last synchronized the connected
            vehicle digital twin.
          example: FORDPASS
        last_updated_date_time:
          type: string
          description: The date and time when the connected vehicle digital twin was
            last updated.
          format: date-time
          example: 2026-07-24T01:33:38Z
        connected_notes:
          maxLength: 4000
          minLength: 1
          type: string
          description: "Operational remarks documenting connected vehicle provisioning,\
            \ telemetry synchronization, device onboarding, or platform integration\
            \ issues."
          example: Telematics gateway reprovisioned after battery replacement.
      description: Connected vehicle digital twin representing the latest known operational
        state of a vehicle.
    ConnectedVehicleAlerts:
      type: array
      items:
        $ref: "#/components/schemas/VehicleAlert"
