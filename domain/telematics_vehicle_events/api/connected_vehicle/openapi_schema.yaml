    VehicleTelemetryEventReference:
      type: object
      properties:
        vehicle_telemetry_event_reference_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable identifier representing this telemetry event
            reference.
          example: VTREF-882211
        vehicle_telemetry_event_reference_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external identifier representing this telemetry event reference.
          example: VTREF-2026-001
        vehicle_telemetry_event_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The aggregate root key of the referenced vehicle telemetry
            event.
          example: VTEL-998211
        vehicle_telemetry_event_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external identifier of the referenced vehicle telemetry
            event.
          example: TEL-2026-00991
        connected_vehicle_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The connected vehicle associated with the telemetry event.
          example: CV-882211
        vehicle_identifier_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The canonical vehicle identifier associated with the telemetry
            event.
          example: VEH-882211
        telemetry_event_type:
          $ref: "#/components/schemas/TelemetryEventTypes"
        vehicle_event_category_type:
          $ref: "#/components/schemas/VehicleEventCategoryTypes"
        occurrence_date_time:
          type: string
          description: The timestamp when the telemetry event occurred.
          format: date-time
          example: 2026-07-30T19:21:23Z
        position:
          $ref: "#/components/schemas/Position"
        event_sequence_num:
          maxLength: 40
          minLength: 1
          type: string
          description: The sequence number assigned to the telemetry event.
          example: "123456789"
        correlation_id:
          maxLength: 120
          minLength: 1
          type: string
          description: The correlation identifier used to associate related telemetry
            events.
          example: CORR-882211
        source_system_code:
          maxLength: 80
          minLength: 1
          type: string
          description: The originating system that produced the telemetry event.
          example: FORDPASS
        event_confidence_score:
          maxLength: 20
          minLength: 1
          type: string
          description: The confidence score assigned to the telemetry event.
          example: "0.998"
        telemetry_hash:
          maxLength: 256
          minLength: 1
          type: string
          description: The immutable integrity hash associated with the telemetry
            event.
          example: SHA256:4d9b9c7a...
        system_codes:
          $ref: "#/components/schemas/Codes"
        telemetry_snapshots:
          $ref: "#/components/schemas/VehicleTelemetryObservations"
      description: Vehicle Telemetry Event Reference
