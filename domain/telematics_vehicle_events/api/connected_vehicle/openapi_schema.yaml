          description: The vessel number identifying the ocean-going vessel responsible
            for transporting the vehicle during maritime shipment.
          example: VESSEL-ATLANTIC-001
        voyage_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The voyage number assigned by the shipping carrier to identify
            a specific maritime journey.
          example: VOY-2026-0421
        port_processing_number:
          maxLength: 60
          minLength: 1
          type: string
          description: "The port processing number used to track vehicle inspection,\
            \ preparation, and accessory installation activities performed at the\
            \ port facility."
          example: PORT-PP-884512
        carrier_reference_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The carrier-assigned reference number used to track transportation
            activities across shipping and logistics providers.
          example: CARR-REF-992311
        transport_load_number:
          maxLength: 60
          minLength: 1
          type: string
          description: "The transportation load number identifying the shipment load,\
            \ convoy, rail consist, or carrier movement containing the vehicle."
          example: LOAD-2026-10842
        distribution_center_code:
          maxLength: 30
          minLength: 1
          type: string
          description: "The code identifying the distribution center, processing center,\
            \ or logistics hub responsible for handling the vehicle."
          example: ATL-DC01
        ramp_code:
          maxLength: 30
          minLength: 1
          type: string
          description: The rail ramp or vehicle processing ramp code identifying the
            transfer location used during vehicle distribution.
          example: ATL-RAMP-07
        convoy_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The convoy number identifying a grouped transportation movement
            of vehicles managed as a single logistics unit.
          example: CONVOY-2026-015
        logistics_identifiers:
          $ref: "#/components/schemas/Identifiers"
        shipment_references:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/ShipmentReference"
        logistics_status_type:
          $ref: "#/components/schemas/VehicleLogisticsStatusTypes"
        logistics_period:
          $ref: "#/components/schemas/EffectivePeriod"
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: The source system code identifying the system of record or
            integration source for the vehicle logistics profile.
          example: OEM_LOGISTICS
        occurrence_date_time:
          type: string
          description: "The date and time when the vehicle logistics profile information\
            \ was observed, created, received, or became effective."
          format: date-time
          example: 2026-07-22T16:47:08Z
        shipment_events:
          $ref: "#/components/schemas/ShipmentEvents"
        rail_position:
          maxLength: 80
          minLength: 1
          type: string
          description: The assigned position of the vehicle on the railcar.
          example: A12
        truck_position:
          maxLength: 80
          minLength: 1
          type: string
          description: The assigned position of the vehicle on the transport truck.
          example: UPPER_FRONT
        deck:
          maxLength: 80
          minLength: 1
          type: string
          description: "The vessel, rail, or transport deck where the vehicle is positioned."
          example: DECK-3
        container_number:
          maxLength: 100
          minLength: 1
          type: string
          description: "The container number associated with the vehicle movement,\
            \ when applicable."
          example: CONT-77821
        chock_position:
          maxLength: 120
          minLength: 1
          type: string
          description: The chock position used to secure the vehicle during transportation.
          example: FRONT_LEFT_REAR_RIGHT
        tie_down_information:
          maxLength: 1000
          minLength: 1
          type: string
          description: "Tie-down, restraint, or securement information used during\
            \ vehicle transportation."
        load_sequence:
          maxLength: 40
          minLength: 1
          type: string
          description: The loading sequence assigned to the vehicle during transportation.
          example: "004"
      description: "Comprehensive vehicle details including identifiers, configuration,\
        \ and status."
