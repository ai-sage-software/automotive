    VehicleSignalState:
      type: object
      properties:
        vehicle_signal_state_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable identifier representing the vehicle signal state.
          example: VSS-STATE-882211
        vehicle_signal_state_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external or source-system identifier representing the vehicle
            signal state.
          example: VSS-STATE-2026-000001
        vss_path:
          maxLength: 255
          minLength: 1
          type: string
          description: The Vehicle Signal Specification path identifying the signal
            node.
          example: Vehicle.Cabin.Door.Row1.Left.IsLocked
        signal_name:
          maxLength: 120
          minLength: 1
          type: string
          description: The short signal name associated with the VSS path.
          example: IsLocked
        signal_group:
          maxLength: 120
          minLength: 1
          type: string
          description: The logical signal group or VSS branch associated with the
            signal.
          example: Door
        component_position_type:
          maxLength: 80
          minLength: 1
          type: string
          description: The physical or logical position of the vehicle component represented
            by the signal.
          example: ROW1_LEFT
        metric_value:
          $ref: "#/components/schemas/MetricValue"
        signal_value:
          maxLength: 4000
          minLength: 1
          type: string
          description: The raw or normalized signal value as text for non-metric signal
            values.
          example: "true"
        signal_uom_type:
          $ref: "#/components/schemas/NarrativeUomTypes"
        severity_type:
          $ref: "#/components/schemas/SeverityTypes"
        sensor_status_type:
          $ref: "#/components/schemas/SensorStatusTypes"
        vehicle_telemetry_event_reference:
          $ref: "#/components/schemas/VehicleTelemetryEventReference"
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: "The source system, OEM platform, device, or provider that\
            \ supplied the signal state."
          example: FORDPASS
        source_signal_key:
          maxLength: 255
          minLength: 1
          type: string
          description: The provider-specific signal key or source path used to map
            into the VSS path.
          example: tpms.frontLeft.pressure
        signal_codes:
          $ref: "#/components/schemas/Codes"
        privacy_codes:
          $ref: "#/components/schemas/Codes"
        governance_codes:
          $ref: "#/components/schemas/Codes"
        event_confidence_score:
          maxLength: 20
          minLength: 1
          type: string
          description: The confidence score assigned to the signal state by the source
            platform or normalization process.
          example: "0.997"
        occurrence_date_time:
          type: string
          description: The date and time when the signal state was observed by the
            vehicle or connected device.
          format: date-time
          example: 2026-07-22T16:47:08Z
        last_updated_date_time:
          type: string
          description: The date and time when the connected vehicle signal state was
            last updated.
          format: date-time
          example: 2026-07-22T16:47:08Z
      description: "Represents the latest VSS-aligned signal state for a connected\
        \ vehicle component, sensor, or logical vehicle data node."
    VehicleSignalStates:
      type: array
      items:
        $ref: "#/components/schemas/VehicleSignalState"
    VehicleTelemetryEventReference:
