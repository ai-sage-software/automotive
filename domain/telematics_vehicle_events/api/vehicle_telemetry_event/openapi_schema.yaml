          description: The external or provider-generated identifier for the vehicle
            state reading.
          example: STATE-2026-00991
        vehicle_state_name:
          maxLength: 150
          minLength: 1
          type: string
          description: The human-readable name of the vehicle state reading.
          example: Battery State of Charge
        value:
          maxLength: 500
          minLength: 1
          type: string
          description: The raw or normalized value captured for the vehicle state
            reading.
          example: "82"
        vehicle_system_type:
          $ref: "#/components/schemas/VehicleSystemTypes"
        vehicle_resource_type:
          $ref: "#/components/schemas/VehicleResourceTypes"
        vehicle_value_type:
          $ref: "#/components/schemas/VehicleStateUomTypes"
        vehicle_state_type:
          $ref: "#/components/schemas/VehicleStateTypes"
        vehicle_status_type:
          $ref: "#/components/schemas/VehicleStatusTypes"
        occurrence_date_time:
          type: string
          description: The timestamp documenting when the vehicle state reading was
            observed.
          format: date-time
          example: 2026-07-24T14:55:42Z
        recorded_date_time:
          type: string
          description: The timestamp documenting when the vehicle state reading was
            recorded by the platform.
          format: date-time
          example: 2026-07-24T14:55:42Z
