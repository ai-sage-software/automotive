    VehicleTelemetryEvent:
      type: object
      properties:
        vehicle_telemetry_event_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable identifier representing a connected vehicle telemetry
            event.
          example: VTEL-882211
        vehicle_telemetry_event_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external provider or platform-generated telemetry event
            identifier.
          example: TEL-2026-00991
        telemetry_event_type:
          $ref: "#/components/schemas/TelemetryEventTypes"
        telemetry_source:
          maxLength: 80
          minLength: 1
          type: string
          description: "The source system, OEM platform, device, modem, or provider\
            \ that generated the telemetry event."
          example: FORDPASS
        device_identifier:
          maxLength: 120
          minLength: 1
          type: string
          description: "The connected device, modem, gateway, or sensor identifier\
            \ that produced the telemetry event."
          example: TCU-778812
        occurrence_date_time:
          type: string
          description: The timestamp when the telemetry event was observed by the
            vehicle or connected device.
          format: date-time
          example: 2026-07-24T14:55:42Z
        recorded_date_time:
          type: string
          description: The timestamp when the telemetry event was recorded or persisted
            by the platform.
          format: date-time
          example: 2026-07-24T14:55:42Z
        position:
          $ref: "#/components/schemas/Position"
        telemetry_snapshots:
          $ref: "#/components/schemas/VehicleTelemetrySnapshots"
        vehicle_states:
          $ref: "#/components/schemas/VehicleStates"
        diagnostic_trouble_codes:
          $ref: "#/components/schemas/Codes"
        telemetry_codes:
          $ref: "#/components/schemas/Codes"
        payload:
          $ref: "#/components/schemas/Object"
        vehicle_reference:
          $ref: "#/components/schemas/VehicleReference"
        vehicle_identifier_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The canonical vehicle identifier key associated with the telemetry
            event.
          example: VID-00088211
        connected_vehicle_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The connected vehicle aggregate key associated with the telemetry
            event.
          example: CV-998211
        ingested_date_time:
          type: string
          description: The date and time when the telemetry event was ingested into
            the platform.
          format: date-time
          example: 2026-07-24T14:55:42Z
        event_sequence_num:
          maxLength: 40
          minLength: 1
          type: string
          description: The sequence number assigned to the telemetry event within
            the telemetry stream.
          example: "00000012345"
        correlation_id:
          maxLength: 120
          minLength: 1
          type: string
          description: The correlation identifier used to associate related telemetry
            events.
          example: CORR-882211
        causation_id:
          maxLength: 120
          minLength: 1
          type: string
          description: The identifier of the event that caused this telemetry event.
          example: CAUSE-882211
        telemetry_hash:
          maxLength: 256
          minLength: 1
          type: string
          description: The immutable hash used to verify telemetry event integrity.
          example: SHA256:9abf2c...
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: The source system or connected vehicle platform that produced
            the telemetry event.
          example: FORDPASS
        source_record_key:
          maxLength: 120
          minLength: 1
          type: string
          description: The source system record key associated with the telemetry
            event.
          example: TEL-REC-998211
        event_confidence_score:
          maxLength: 20
          minLength: 1
          type: string
          description: The confidence score assigned to the telemetry event by the
            source platform.
          example: "0.998"
        data_sharing_consent_indicator:
          type: boolean
          description: Indicates whether telemetry data sharing was authorized by
            the vehicle owner or controlling party.
          example: true
        privacy_codes:
          $ref: "#/components/schemas/Codes"
        governance_codes:
          $ref: "#/components/schemas/Codes"
        raw_payload:
          type: string
          description: The original provider-specific telemetry payload preserved
            for auditing and replay.
        payload_schema_codes:
          $ref: "#/components/schemas/Codes"
      description: Vehicle Telemetry Event
    VehicleTelemetryMetricTypes:
      type: string
