          type: boolean
          description: Indicates whether the canonical vehicle identity remains active
            and valid within the enterprise registry.
          example: true
        created_date_time:
          type: string
          description: The timestamp documenting when the canonical vehicle identity
            was initially established.
          format: date-time
          example: 2026-07-16T17:21:18Z
        last_updated_date_time:
          type: string
          description: The timestamp documenting the most recent update applied to
            the canonical vehicle identity.
          format: date-time
          example: 2026-07-16T17:21:18Z
