components:
  schemas:
    ActorReference:
      type: object
      properties:
        actor_reference_id:
          type: string
          description: Unique system-specific internal identifier.
          example: pr-8821-x01
        actor_reference_key:
          type: string
          description: Unique global internal or external business key.
          example: REF-SALE-2026-CUST-99
        actor_key:
          type: string
          description: Unique global internal or external business key.
          example: CUST-DEALER-4412
        actor_name:
          type: string
          description: The formal display name of the Actor at the time of reference.
          example: Northside Chevrolet Service Center
        actor_type:
          $ref: "#/components/schemas/ActorTypes"
        privacy_policy_rules:
          $ref: "#/components/schemas/PrivacyPolicyRules"
        occurrence_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-07-21T19:14:42Z
      description: External system identifier
    ActorTypes:
      type: string
      description: types of actors.
      example: USER
      enum:
      - USER
      - CUSTOMER
      - EMPLOYEE
      - DEALER
      - VENDOR
      - SUPPLIER
      - ORGANIZATION
      - SYSTEM
      - SERVICE
      - APPLICATION
      - API
      - AGENT
      - AI_AGENT
      - WORKFLOW
      - RULE_ENGINE
      - DEVICE
      - SENSOR
      - PARTNER
      - CONTRACTOR
      - GOVERNMENT
      - PROCESS
      - SCHEDULER
      - EVENT_HANDLER
      - UNKNOWN
    AddressReference:
      type: object
      properties:
        address_reference_key:
          type: string
          description: Unique global internal or external business key.
          example: "867485065804775424"
        address_reference_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "867485065804775425"
        address_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: address_types list
          example:
          - SERVICE_CONTRACT
          items:
            $ref: "#/components/schemas/AddressTypes"
        address_line1:
          type: string
          description: "Primary address line (Street, PO Box, etc)."
          example: 123 Main St
        address_line2:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: Suite 400
        address_line3:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: Building A
        address_line4:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: Mail Stop 22
        address_line5:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: "Attention: Accounts Payable"
        city:
          type: string
          description: Name of the city.
          example: Atlanta
        country_code:
          type: string
          description: Full name of the country.
          example: US
        district:
          type: string
          description: Name of the district.
          example: North District
        label:
          maxLength: 50
          type: string
          description: Label or display name for the address.
          example: Work Email
        postal_code:
          maxLength: 20
          minLength: 3
          type: string
          description: Primary postal or ZIP code.
          example: "30303"
        state_province:
          maxLength: 50
          type: string
          description: State or equivalent subdivision.
          example: GA
      description: "A reference to an address, including its unique key and a list\
        \ of its usage types."
    AddressReferences:
      type: array
      items:
        $ref: "#/components/schemas/AddressReference"
    AddressTypes:
      type: string
      description: types of address.
      example: BILLING
      enum:
      - BILLING
      - SHIPPING
      - MAILING
      - POSTAL
      - HOME
      - RESIDENCE
      - WORK
      - BUSINESS
      - OFFICE
      - PO_BOX
      - LEGAL
      - SERVICE
      - DEALER
      - CONTRACT
      - AR_ADDRESS
      - RECIPIENT
      - DELIVERY
      - DESTINATION
      - ORIGINAL
      - CURRENT
      - PREVIOUS
      - TEMPORARY
      - VACATION
      - GARAGE
      - EMERGENCY
      - REBATE
      - SERVICE_CONTRACT
      - INSURANCE
      - PRODUCT
      - ARCHIVE
      - RAMP
      - RAIL
      - PORT
      - CONVOY
      - HUB
      - OTHER
    AppointmentChannelTypes:
      type: string
      description: types of appointment channels.
      example: REMOTE
      enum:
      - REMOTE
      - VIRTUAL
      - IN_STORE
      - CUSTOMER_ON_SITE
      - FLEET_DEPOT
      - ROADSIDE_TRANSIT
      - CURBSIDE
      - PARTNER_LOCATION
      - OTHER
    AppointmentLocation:
      type: object
      properties:
        appointment_location_key:
          type: string
          description: Unique global internal or external business key.
          example: "867485065876078592"
        position:
          $ref: "#/components/schemas/Position"
        address_reference:
          $ref: "#/components/schemas/AddressReference"
        department_reference:
          $ref: "#/components/schemas/DepartmentReference"
        department_type:
          $ref: "#/components/schemas/DepartmentTypes"
        virtual_appointment:
          $ref: "#/components/schemas/CommunicationChannel"
        bay_identifier:
          type: string
          description: The specific physical work bay or service station allocated
            for this scheduling event.
          example: BAY-04-EV
        bay_capability_type:
          $ref: "#/components/schemas/BayAvailabilityTypes"
        is_exclusive_allocation:
          type: boolean
          description: "Indicates if this bay is exclusively reserved for this time\
            \ slot, preventing double-booking or over-allocation of the physical space."
          example: true
        max_bay_occupancy_limit:
          type: integer
          description: "The absolute concurrent limit of vehicles allowed in this\
            \ physical area at one time (e.g., detail shop or wash bays might allow\
            \ 3, single lift bays allow 1)."
          format: int32
          example: 1
        historical_avg_bay_seconds:
          type: integer
          description: "The running historical average time, in seconds, that similar\
            \ service profiles occupy this specific physical bay location."
          format: int64
          example: 3600
        historical_bay_efficiency_ratio:
          type: number
          description: "The point-in-time calculation snapshot representing actual\
            \ work time divided by total physical bay occupancy time (e.g., 0.85 =\
            \ 85% of bay stay was active labor)."
          format: double
          example: 0.85
        historical_sample_count:
          type: integer
          description: The total historical run sample size utilized by the analytical
            engine to resolve the running duration and efficiency metrics.
          format: int32
          example: 250
      description: Represents the physical or virtual location details of an appointment.
    AppointmentLocations:
      type: array
      items:
        $ref: "#/components/schemas/AppointmentLocation"
    AppointmentSourceTypes:
      type: string
      description: types of appointment sources.
      example: DEALERSHIP_INITIATED
      enum:
      - DEALERSHIP_INITIATED
      - INTERNET
      - PHONE
      - SERVICE_ADVISOR_INITIATED
      - TELEPHONE_APP
      - WALK_IN
      - KIOSK
      - MOBILE_OEM_TELEMATICS
      - CONSUMER_PORTAL
      - MOBILE_APP
      - TELEPHONY_IVR
      - CHAT_BOT
      - DMS_DIRECT
      - THIRD_PARTY_AGGREGATOR
      - CONNECTED_VEHICLE
      - UNKNOWN
      - OTHER
    AppointmentStatusTypes:
      type: string
      description: types of appointment status.
      example: AVAILABLE
      enum:
      - AVAILABLE
      - PREFERRED
      - SELECTED
      - WAIT_LIST
      - BLOCKED
      - UNAVAILABLE
      - RESERVED
      - TENTATIVE
      - CONFIRMATION_PENDING
      - CONFIRMED
      - RESERVATION_EXPIRED
      - RELEASED
      - ALTERNATE_PROPOSED
      - ALTERNATE_ACCEPTED
      - ALTERNATE_DECLINED
      - REMINDER_PENDING
      - REMINDER_SENT
      - REMINDER_ACKNOWLEDGED
      - CHECK_IN_PENDING
      - ARRIVED
      - CHECKED_IN
      - READY
      - GRACE_PERIOD
      - LATE_ARRIVAL
      - IN_PROGRESS
      - ON_HOLD
      - PARTIALLY_FULFILLED
      - FULFILLED
      - FOLLOW_UP_REQUIRED
      - CLOSED
      - NO_SHOW
      - NO_SHOW_REVIEW
      - NO_SHOW_CONFIRMED
      - NO_SHOW_RECOVERED
      - RESCHEDULE_INITIATED
      - RESCHEDULE_ACKNOWLEDGED
      - RESCHEDULE_PROCESSING
      - RESCHEDULE_PROPOSED
      - RESCHEDULE_PENDING_AGREEMENT
      - RESCHEDULE_AGREED
      - RESCHEDULE_COMPLETED
      - RESCHEDULE_DECLINED
      - CANCELLATION_REQUESTED
      - CANCELLATION_ACKNOWLEDGED
      - CANCELLATION_PROCESSING
      - CANCELLATION_DECLINED
      - CANCELLED
      - EXPIRED
      - DECLINED
      - REJECTED
      - FAILED
    AppointmentTypes:
      type: string
      description: types of appointments.
      example: SALES
      enum:
      - SALES
      - F_AND_I
      - TRADE_EVALUATION
      - TEST_DRIVE
      - DELIVERY
      - VEHICLE_SALE
      - SERVICE
      - SCHEDULED_SERVICE
      - WARRANTY_REPAIR
      - WARRANTY
      - EXTENDED_SERVICE
      - RECALL_REMEDIAL
      - RECALL
      - FSA
      - CAMPAIGN
      - DIAGNOSTIC_ESTIMATE
      - PRE_DELIVERY_INSPECTION
      - UPFIT_CUSTOMIZATION
      - FLEET_COMMISSIONING
      - DECOMMISSIONING
      - VALET_COLLECTION
      - VEHICLE_PICKUP
      - ROADSIDE_ASSISTANCE
      - TOWING
      - RECOVERY
      - BODY_SHOP
      - QUICKLANE
      - GOVT
      - CUSTOMER
      - INTERNAL
      - OTHER
    AuthorizationLevel:
      type: object
      properties:
        update_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-07-21T19:14:42Z
        authorized_indicator:
          type: boolean
          description: Indicates whether the authorization is currently active or
            granted
          example: false
        authorization_level_key:
          type: string
          description: Unique global internal or external business key.
          example: "867485065880272896"
        auth_codes:
          $ref: "#/components/schemas/Codes"
        privacy_policy_rules:
          $ref: "#/components/schemas/PrivacyPolicyRules"
      description: Establish authorization level
    AuthorizationLevels:
      type: array
      items:
        $ref: "#/components/schemas/AuthorizationLevel"
    BayAvailabilityTypes:
      type: string
      description: types of bay availabilitys.
      example: STANDARD_LIFT
      enum:
      - STANDARD_LIFT
      - HEAVY_DUTY_LIFT
      - QUICK_LUBE
      - ALIGNMENT_RACK
      - EV_DIAGNOSTIC
      - ADAS_CALIBRATION
      - DIAGNOSTIC_STATION
      - BODY_AND_FRAME
      - DETAIL_AND_WASH
      - OTHER
    BusinessContext:
      type: object
      properties:
        intent_code:
          type: string
          description: "The unique identifier code for the strategic intent (e.g.,\
            \ IMPROVE_NET_OPERATING_VALUE)."
          example: Intent Request Unique Code
        business_action_code:
          type: string
          description: "The unique identifier code for the specific business action\
            \ (e.g., MINIMIZE_HOLDING_COSTS)."
          example: Business Action Unique Code
        correlation_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "867485065880272897"
        previous_balance:
          $ref: "#/components/schemas/GeneralAmount"
        resulting_balance:
          $ref: "#/components/schemas/GeneralAmount"
      description: "Represents the strategic lineage, intention, and operational state\
        \ accompanying an execution vector or streaming lifecycle event."
    Code:
      type: object
      properties:
        code_id:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique system-specific internal identifier.
          example: cd-9902-v1
        code_key:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique global internal or external business key.
          example: VEHICLE_STATUS_CODE
        code:
          maxLength: 50
          minLength: 1
          type: string
          description: The literal value or mnemonic represented by this record.
          example: IN_TRANSIT
        description:
          maxLength: 255
          minLength: 5
          type: string
          description: A human-readable explanation of what the code represents.
          example: Indicates the vehicle has left the factory but not yet arrived
            at the dealer.
      description: not nullable
    Codes:
      type: array
      items:
        $ref: "#/components/schemas/Code"
    ColorSummaries:
      type: array
      items:
        $ref: "#/components/schemas/ColorSummary"
    ColorSummary:
      type: object
      properties:
