      description: "Represents a warranty claim submitted for coverage, authorization,\
        \ reimbursement, or adjudication."
    WarrantyClaims:
      type: array
      items:
        $ref: "#/components/schemas/WarrantyClaim"
    WarrantyReference:
      type: object
      properties:
        warranty_reference_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable identifier representing the warranty reference.
          example: WARR-REF-882211
        warranty_reference_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external or source-system identifier representing the warranty
            reference.
          example: WARR-REF-2026-000001
        warranty_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The aggregate key of the referenced warranty.
          example: WARR-882211
        warranty_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external or source-system identifier of the referenced
            warranty.
          example: WARR-2026-000882
        warranty_number:
          maxLength: 100
          minLength: 1
          type: string
          description: "The warranty agreement, contract, or policy number."
          example: WRN-998211
        warranty_name:
          maxLength: 160
          minLength: 1
          type: string
          description: The display name of the warranty.
          example: Factory Powertrain Warranty
        warranty_status_type:
          $ref: "#/components/schemas/LifecycleStatusTypes"
        effective_period:
          $ref: "#/components/schemas/EffectivePeriod"
        provider_party:
          $ref: "#/components/schemas/PartyReference"
        warranty_codes:
          $ref: "#/components/schemas/Codes"
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: The source system that supplied or synchronized the warranty
            reference.
          example: DMS
        occurrence_date_time:
          type: string
          description: The date and time when the warranty reference was created or
            became effective.
          format: date-time
          example: 2026-07-23T17:18:58Z
      description: Lightweight reference to a Warranty aggregate.
    WarrantyReferences:
      type: array
      items:
        $ref: "#/components/schemas/WarrantyReference"
