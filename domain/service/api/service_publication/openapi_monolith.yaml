        communication_channel_key:
          type: string
          description: Unique global internal or external business key.
          example: "868306131443777549"
        communication_channel_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "868306131443777550"
        communication_channel_type:
          $ref: "#/components/schemas/CommunicationChannelTypes"
        context:
          type: string
          description: Context or domain of the identifier
