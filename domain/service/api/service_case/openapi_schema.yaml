    ServiceCase:
      type: object
      properties:
        service_case_key:
          type: string
          description: The unique key for the service case.
        case_id:
          type: string
          description: The unique ID for the case.
        case_name:
          type: string
          description: The name or subject header of the case.
        service_order_key:
          type: string
          description: Key of the associated Service/Repair Order.
        labor_operation_key:
          type: string
          description: Key of the specific Labor Operation in dispute or exception.
        customer_key:
          type: string
          description: Key of the customer associated with the case.
        case_type:
          $ref: "#/components/schemas/CaseTypes"
        case_status:
          $ref: "#/components/schemas/CaseStatusTypes"
        case_reason:
          type: string
          description: Categorical reason code or string driving the exception.
        case_type_codes:
          $ref: "#/components/schemas/Codes"
        case_owner_name:
          type: string
