    PrivacyConsent:
      type: object
      properties:
        privacy_consent_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The persistent identifier representing the canonical privacy
            consent entry.
          example: PCT-883011
        privacy_consent_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The immutable key for the privacy consent record.
          example: PCK-00044122
        consent_status_type:
          $ref: "#/components/schemas/ConsentStatusTypes"
        regulatory_framework_type:
          $ref: "#/components/schemas/RegulatoryFrameworkTypes"
        telemetry_data_consent_indicator:
          type: boolean
          description: "Indicates whether consent is granted for streaming vehicle\
            \ telemetry, diagnostics, and sensor data."
          example: true
        location_data_consent_indicator:
          type: boolean
          description: Indicates whether explicit consent is granted for collecting
            and sharing real-time spatial/GPS location data.
          example: false
        biometric_data_consent_indicator:
          type: boolean
          description: "Indicates whether consent is granted for in-cabin driver monitoring,\
            \ facial recognition, or biometric processing."
          example: false
        third_party_sharing_consent_indicator:
          type: boolean
          description: "Indicates whether consent allows data distribution to external\
            \ partners, insurance carriers, or OEMs."
          example: true
        marketing_consent_indicator:
          type: boolean
          description: Indicates whether consent is granted to utilize vehicle usage
            metrics for personalized marketing and offers.
          example: false
        consenting_party_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The enterprise party reference key representing the legal entity
            or driver who executed the consent.
          example: PRT-992011
        consent_version:
          maxLength: 30
          minLength: 1
          type: string
          description: The specific legal privacy policy version or terms of service
            agreement accepted by the party.
          example: v2026.1.0
        effective_period:
          $ref: "#/components/schemas/EffectivePeriod"
        granted_date_time:
          type: string
          description: The timestamp documenting when privacy consent was formally
            executed.
          format: date-time
          example: 2026-07-30T13:43:46Z
        revoked_date_time:
          type: string
          description: The timestamp documenting when privacy consent was explicitly
            revoked or opted out.
          format: date-time
          example: 2026-07-30T13:43:46Z
        consent_codes:
          $ref: "#/components/schemas/Codes"
      description: privacy.consent.desc
