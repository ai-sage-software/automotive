      required: true
      schema:
        type: string
        example: "867810179532455953"
    AgentHeader:
      name: Agent
      in: header
      description: "The URI profile of the calling Agent. Used to negotiate supported\
        \ Industry Extensions (e.g., ) via the protocol."
      required: false
      schema:
        pattern: ^https?://.+
        type: string
        format: uri
        example: https://xxx.com/agent/v1
    VehicleLicenseKey:
      name: vehicle-license-key
      in: path
      description: The unique identifier for an VehicleLicense entity.
      required: true
