      name: Org-Version
      in: header
      description: "The version of the api for the organization that this request\
        \ adheres to (e.g., 2026.01)."
      required: true
      schema:
        maxLength: 20
        minLength: 1
        pattern: "^[a-zA-Z0-9\\.\\-]+$"
        type: string
        example: "2026.01"
    OptionDescriptionKey:
      name: option-description-key
      in: path
      description: The unique identifier for an OptionDescription entity.
      required: true
      schema:
        type: string
        example: "867810179532455937"
    VehicleSpecificationKey:
      name: vehicle-specification-key
      in: path
      description: The unique identifier for an VehicleSpecification entity.
      required: true
      schema:
        type: string
        example: "867810179532455945"
    SourceSystemHeader:
      name: Source-System
      in: header
      description: The system originating the transaction pulse.
      required: true
      schema:
        maxLength: 25
        minLength: 2
        type: string
        example: GM_GLOBAL_NVS
    TotalCountHeader:
      name: Total-Count
      in: header
      required: false
      schema:
        type: string
        example: "1"
    StoreIDHeader:
      name: Store-ID
      in: header
      required: false
      schema:
        type: string
        example: Store-550
    TransmissionSummaryKey:
      name: transmission-summary-key
      in: path
      description: The unique identifier for an TransmissionSummary entity.
      required: true
      schema:
        type: string
        example: "867810179532455957"
    FilterQuery:
      name: filter
      in: query
      description: Filter parameters
      required: false
      schema:
        maxLength: 100
        minLength: 0
        type: string
        example: "sdate:2026-02-09,edate:2026-02-09"
    CreatorCodeHeader:
      name: Creator-Code
      in: header
      description: "Source System Identifier (e.g., TY for Toyota, CDK for DMS)."
      required: false
      schema:
        maxLength: 8
        minLength: 2
        type: string
        example: CDK
    LocaleHeader:
      name: Locale
      in: header
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: en-US
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      description: Used for conditional GETs. The operation is executed only if the
        stored ETag does not match this value. Prevents 'Lost Updates' in high-concurrency
        Service Bounded Contexts.
      required: false
      schema:
        pattern: "^\"?[a-f0-9]+\"?$|^\\*$"
        type: string
        example: '"686897696a7c876b7e"'
    VehicleSummaryKey:
      name: vehicle-summary-key
      in: path
      description: The unique identifier for an VehicleSummary entity.
      required: true
      schema:
