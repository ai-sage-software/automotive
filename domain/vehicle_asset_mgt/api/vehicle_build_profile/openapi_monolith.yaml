      - OTHER
    OptionDescription:
      type: object
      properties:
        option_description_key:
          type: string
          description: Unique global internal or external business key.
          example: "868306124896468994"
        option_description_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "868306124896468995"
        option_description_group:
