    Prices:
      type: array
      items:
        $ref: "#/components/schemas/Price"
    VehicleBuildProfile:
      type: object
      properties:
        vehicle_build_profile_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The persistent key representing the vehicle build profile.
          example: VBP-2026-000001
        vehicle_build_profile_id:
          maxLength: 60
          minLength: 1
          type: string
          description: The externally visible identifier representing the vehicle
            build profile.
          example: VBP-ID-884512
        vehicle_order_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The dealer or customer-facing vehicle order number associated
            with the vehicle order lifecycle.
          example: ORD-2026-001245
        vehicle_identifier_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The canonical enterprise vehicle identity anchor associated
            with this denormalized vehicle reference.
          example: VID-00088211
        factory_order_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The manufacturer-assigned factory order number used to track
            production and fulfillment activities.
          example: FO-884512
        reservation_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The reservation number assigned to a vehicle reservation prior
            to order placement or production scheduling.
          example: RSV-2026-004512
        allocation_number:
          maxLength: 60
          minLength: 1
          type: string
          description: "The allocation number representing the manufacturer's inventory\
            \ allocation assignment to a dealer, distributor, or fleet organization."
          example: ALLOC-2026-00987
        allocation_pool_number:
          maxLength: 60
          minLength: 1
          type: string
          description: "The allocation pool number identifying the manufacturer allocation\
            \ program, distribution pool, or inventory assignment group associated\
            \ with the vehicle."
          example: POOL-SE-2026-015
        build_batch_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The manufacturing batch number grouping vehicles scheduled
            for assembly during the same production cycle.
          example: BATCH-2026-0821
        build_sequence_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The manufacturing build sequence number assigned during vehicle
            assembly scheduling.
          example: SEQ-10542
        production_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The production tracking number assigned by the manufacturer
            for vehicle assembly and plant operations.
          example: PROD-778921
        production_plant_code:
          maxLength: 30
          minLength: 1
          type: string
          description: The manufacturer-assigned production plant code identifying
            the assembly facility where the vehicle was produced.
          example: TMMK
        build_status_type:
          $ref: "#/components/schemas/VehicleBuildStatusTypes"
        build_period:
          $ref: "#/components/schemas/EffectivePeriod"
        configuration_codes:
          $ref: "#/components/schemas/Codes"
        vehicle_options:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/VehicleOption"
        identifiers:
          $ref: "#/components/schemas/Identifiers"
        tags:
          $ref: "#/components/schemas/Codes"
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: The source system code identifying the system of record or
            integration source for the vehicle build profile.
          example: OEM_ORDER_BANK
        occurrence_date_time:
          type: string
          description: "The date and time when the vehicle build profile information\
            \ was observed, created, received, or became effective."
          format: date-time
          example: 2026-07-23T17:19:02Z
      description: "Comprehensive vehicle details including identifiers, configuration,\
        \ and status."
    VehicleBuildProfileCreate:
      required:
      - vehicle_build_profile_key
      type: object
      description: VehicleBuildProfile Create for Post
      allOf:
      - $ref: "#/components/schemas/VehicleBuildProfile"
    VehicleBuildProfileUpdate:
      type: object
      properties:
        production_plant_code:
          maxLength: 30
          minLength: 1
          type: string
          description: The manufacturer-assigned production plant code identifying
            the assembly facility where the vehicle was produced.
          example: TMMK
        identifiers:
          $ref: "#/components/schemas/Identifiers"
        build_status_type:
          $ref: "#/components/schemas/VehicleBuildStatusTypes"
        tags:
          $ref: "#/components/schemas/Codes"
        configuration_codes:
          $ref: "#/components/schemas/Codes"
        build_batch_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The manufacturing batch number grouping vehicles scheduled
            for assembly during the same production cycle.
          example: BATCH-2026-0821
        build_sequence_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The manufacturing build sequence number assigned during vehicle
            assembly scheduling.
          example: SEQ-10542
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: The source system code identifying the system of record or
            integration source for the vehicle build profile.
          example: OEM_ORDER_BANK
        vehicle_options:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/VehicleOption"
        production_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The production tracking number assigned by the manufacturer
            for vehicle assembly and plant operations.
          example: PROD-778921
        vehicle_order_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The dealer or customer-facing vehicle order number associated
            with the vehicle order lifecycle.
          example: ORD-2026-001245
        allocation_number:
          maxLength: 60
          minLength: 1
          type: string
          description: "The allocation number representing the manufacturer's inventory\
            \ allocation assignment to a dealer, distributor, or fleet organization."
          example: ALLOC-2026-00987
        allocation_pool_number:
          maxLength: 60
          minLength: 1
          type: string
          description: "The allocation pool number identifying the manufacturer allocation\
            \ program, distribution pool, or inventory assignment group associated\
            \ with the vehicle."
          example: POOL-SE-2026-015
        build_period:
          $ref: "#/components/schemas/EffectivePeriod"
        factory_order_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The manufacturer-assigned factory order number used to track
            production and fulfillment activities.
          example: FO-884512
        reservation_number:
          maxLength: 60
          minLength: 1
          type: string
          description: The reservation number assigned to a vehicle reservation prior
            to order placement or production scheduling.
          example: RSV-2026-004512
        occurrence_date_time:
          type: string
          description: "The date and time when the vehicle build profile information\
            \ was observed, created, received, or became effective."
          format: date-time
          example: 2026-07-23T17:19:02Z
      description: VehicleBuildProfile Update for Patch and Put
    VehicleBuildStatusTypes:
      type: string
      description: types of vehicle build status.
      enum:
      - PENDING
      - RESERVED
      - ALLOCATED
      - SCHEDULED
      - IN_PRODUCTION
      - BUILT
      - QUALITY_INSPECTION
      - RELEASED
      - IN_TRANSIT
      - DELIVERED
      - ON_HOLD
      - REWORK
      - CANCELLED
    VehicleOption:
      type: object
      properties:
        vehicle_option_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The business or integration key that uniquely identifies the
            vehicle option.
        manufacturer_name:
          maxLength: 120
          minLength: 1
          type: string
          description: "The manufacturer, brand, or source responsible for producing\
            \ or supplying the vehicle option."
        option_category:
          $ref: "#/components/schemas/Codes"
        option_code:
          maxLength: 60
          minLength: 1
          type: string
          description: "The manufacturer, OEM, or source system code assigned to the\
            \ vehicle option."
        option_descriptions:
          $ref: "#/components/schemas/OptionDescriptions"
        option_groups:
          $ref: "#/components/schemas/Codes"
        option_installation_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/OptionInstallationTypes"
        option_name:
          maxLength: 120
          minLength: 1
          type: string
          description: The display name or business name of the vehicle option.
        option_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          items:
            $ref: "#/components/schemas/OptionTypes"
        quantity:
          $ref: "#/components/schemas/MetricValue"
        prices:
          $ref: "#/components/schemas/Prices"
        short_description:
          maxLength: 255
          minLength: 1
          type: string
          description: A concise display description of the vehicle option.
      description: options and options of a vehicle
