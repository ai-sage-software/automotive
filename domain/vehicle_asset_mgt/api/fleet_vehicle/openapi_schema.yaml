          type: string
          description: The date and time of the latest event recorded in the vehicle
            ledger.
          format: date-time
          example: 2026-07-23T17:17:42Z
        last_event_category_type:
          $ref: "#/components/schemas/VehicleEventCategoryTypes"
        last_vehicle_event_type:
          $ref: "#/components/schemas/VehicleEventTypes"
        last_event_summary:
          maxLength: 1000
          minLength: 1
          type: string
          description: A short summary of the latest meaningful event recorded in
            the vehicle ledger.
          example: "Oil change completed at 42,118 miles."
        current_odometer:
          $ref: "#/components/schemas/MetricValue"
