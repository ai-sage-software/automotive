          example: VLED-REF-2026-000001
        vehicle_ledger_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The aggregate key of the referenced vehicle ledger.
          example: VLED-882211
        vehicle_ledger_id:
          maxLength: 80
          minLength: 1
          type: string
          description: The external or source-system identifier of the referenced
            vehicle ledger.
          example: VLED-2026-000882
        vehicle_identifier_key:
          maxLength: 60
          minLength: 1
          type: string
          description: The canonical vehicle identifier key associated with the vehicle
            ledger.
          example: VID-882211
