          maxLength: 40
          minLength: 1
          type: string
          description: The version of the vehicle ledger reference or source ledger
            projection.
          example: 1.0.0
        ledger_hash:
          maxLength: 256
          minLength: 1
          type: string
          description: The immutable hash used to verify the integrity of the referenced
            vehicle ledger projection.
          example: SHA256:9abf2c...
        system_codes:
          $ref: "#/components/schemas/Codes"
        source_system_code:
          maxLength: 60
          minLength: 1
          type: string
          description: The source system that supplied or synchronized the vehicle
            ledger reference.
          example: VEHICLE_HISTORY_PROVIDER
