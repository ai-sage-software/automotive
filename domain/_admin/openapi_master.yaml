openapi: 3.0.1
info:
  title: Master Consolidated API
  description: Automated consolidation of domain-specific schemas
  version: 1.0.0
servers:
- url: /
components:
  schemas:
    AccountingPeriod:
      type: object
      properties:
        identifiers:
          $ref: "#/components/schemas/Identifiers"
        period_desc:
          type: string
          description: Detailed narrative description of the period's scope.
          example: Third Quarter Fiscal Year 2026 - North American Operations
        accounting_period_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538713840291840"
        accounting_period_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538713840291841"
        period_name:
          type: string
          description: Short-hand display name for the period.
          example: July 2026
        start_date:
          type: string
          description: "Calendar date associated with this value, represented in ISO-8601\
            \ date format."
          format: date
          example: 2026-05-27
        end_date:
          type: string
          description: "Calendar date associated with this value, represented in ISO-8601\
            \ date format."
          format: date
          example: 2026-05-28
        accounting_period_status_type:
          $ref: "#/components/schemas/AccountingPeriodStatusTypes"
        fiscal_year:
          pattern: "^\\d{4,6}$"
          type: integer
          description: The 4-digit fiscal year designation.
          example: 3021
      description: "Defines a fiscal period, including its unique identifiers, start\
        \ and end dates, and current status."
    AccountingPeriodCreate:
      required:
      - accounting_period_key
      type: object
      description: AccountingPeriod Create for Post
      allOf:
      - $ref: "#/components/schemas/AccountingPeriod"
    AccountingPeriodStatusTypes:
      type: string
      description: types of accounting period status.
      example: FUTURE
      enum:
      - FUTURE
      - OPEN
      - ADJUSTMENT
      - PENDING_CLOSURE
      - CLOSED
      - LOCKED
      - OTHER
    AccountingPeriodUpdate:
      type: object
      properties:
        end_date:
          type: string
          description: "Calendar date associated with this value, represented in ISO-8601\
            \ date format."
          format: date
          example: 2026-05-08
        period_desc:
          type: string
          description: Detailed narrative description of the period's scope.
          example: Third Quarter Fiscal Year 2026 - North American Operations
        fiscal_year:
          pattern: "^\\d{4,6}$"
          type: integer
          description: The 4-digit fiscal year designation.
          example: 4477
        identifiers:
          $ref: "#/components/schemas/Identifiers"
        accounting_period_status_type:
          $ref: "#/components/schemas/AccountingPeriodStatusTypes"
        period_name:
          type: string
          description: Short-hand display name for the period.
          example: July 2026
        start_date:
          type: string
          description: "Calendar date associated with this value, represented in ISO-8601\
            \ date format."
          format: date
          example: 2026-05-07
      description: AccountingPeriod Update for Patch and Put
    Address:
      type: object
      properties:
        address_locales:
          $ref: "#/components/schemas/AddressLocales"
        priority:
          maxLength: 10
          minLength: 1
          type: string
          description: "Priority indicator for address usage (e.g., billing, shipping)."
          example: PRIMARY
        city_code:
          maxLength: 20
          minLength: 1
          type: string
          description: Standardized city code.
          example: ATL
        address_key:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique global internal or external business key.
          example: "848538714737872896"
        address_id:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique system-specific internal identifier.
          example: "848538714737872897"
        address_input:
          maxLength: 255
          minLength: 1
          type: string
          description: Raw input provided for address processing or validation.
          example: "123 Main St, Atlanta, GA 30303"
        address_line1:
          maxLength: 100
          minLength: 1
          type: string
          description: "Primary address line (Street, PO Box, etc)."
          example: 123 Main St
        address_line2:
          maxLength: 100
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: Suite 400
        address_line3:
          maxLength: 100
          type: string
          description: Additional address line information.
          example: Building A
        address_line4:
          maxLength: 100
          type: string
          description: Additional address line information.
          example: Mail Stop 22
        address_line5:
          maxLength: 100
          type: string
          description: Additional address line information.
          example: "Attention: Accounts Payable"
        address_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: address_types list
          example:
          - CURRENT
          items:
            $ref: "#/components/schemas/AddressTypes"
        authorization_levels:
          $ref: "#/components/schemas/AuthorizationLevels"
        city:
          maxLength: 100
          minLength: 1
          type: string
          description: Name of the city.
          example: Atlanta
        city_subdivision:
          maxLength: 100
          type: string
          description: "Subdivision within the city (e.g., neighborhood, district)."
          example: Midtown
        country:
          maxLength: 100
          minLength: 2
          type: string
          description: Full name of the country.
          example: United States
        country_code:
          maxLength: 2
          minLength: 2
          type: string
          description: ISO 3166-1 Alpha-2 country code.
          example: US
        county:
          maxLength: 100
          type: string
          description: Name of the county.
          example: Fulton
        county_code:
          maxLength: 20
          type: string
          description: Standardized code for the county.
          example: "121"
        label:
          maxLength: 50
          type: string
          description: Label or display name for the address.
          example: Work Email
        position:
          $ref: "#/components/schemas/Position"
        postal_code:
          maxLength: 20
          minLength: 3
          type: string
          description: Primary postal or ZIP code.
          example: "30303"
        postal_code_ext:
          maxLength: 10
          type: string
          description: "Extended postal code (e.g., ZIP+4)."
          example: "1234"
        preferred_indicator:
          type: boolean
          description: Flag indicating if this address is the preferred address.
          example: false
        region:
          maxLength: 50
          type: string
          description: "Administrative region (e.g., province, state)."
          example: Southeast
        state:
          maxLength: 50
          type: string
          description: State or equivalent subdivision.
          example: GA
      description: Address represents a physical or mailing location associated with
        a party or warehouse.
    AddressLocale:
      type: object
      properties:
        address_locale_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538714737872898"
        address_locale_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538714737872899"
        region_code:
          type: string
          description: Code representing the region for the locale.
          example: GA
        region_name:
          type: string
          description: Name of the region for the locale.
          example: Georgia
        region_aliases:
          $ref: "#/components/schemas/Codes"
        location_type:
          $ref: "#/components/schemas/LocationTypes"
      description: External system address locale including region and location type.
    AddressLocales:
      type: array
      items:
        $ref: "#/components/schemas/AddressLocale"
    AddressReference:
      type: object
      properties:
        address_reference_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538714637209600"
        address_reference_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538714637209601"
        address_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: address_types list
          example:
          - MAILING
          items:
            $ref: "#/components/schemas/AddressTypes"
        address_line1:
          type: string
          description: "Primary address line (Street, PO Box, etc)."
          example: 123 Main St
        address_line2:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: Suite 400
        address_line3:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: Building A
        address_line4:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: Mail Stop 22
        address_line5:
          type: string
          description: "Secondary address line (Suite, Apt, etc)."
          example: "Attention: Accounts Payable"
        city:
          type: string
          description: Name of the city.
          example: Atlanta
        country_code:
          type: string
          description: Full name of the country.
          example: US
        district:
          type: string
          description: Name of the district.
          example: North District
        label:
          maxLength: 50
          type: string
          description: Label or display name for the address.
          example: Work Email
        postal_code:
          maxLength: 20
          minLength: 3
          type: string
          description: Primary postal or ZIP code.
          example: "30303"
        state_province:
          maxLength: 50
          type: string
          description: State or equivalent subdivision.
          example: GA
      description: "A reference to an address, including its unique key and a list\
        \ of its usage types."
    AddressReferences:
      type: array
      items:
        $ref: "#/components/schemas/AddressReference"
    AddressTypes:
      type: string
      description: types of address.
      example: BILLING
      enum:
      - BILLING
      - SHIPPING
      - MAILING
      - POSTAL
      - HOME
      - RESIDENCE
      - WORK
      - BUSINESS
      - OFFICE
      - PO_BOX
      - LEGAL
      - SERVICE
      - DEALER
      - CONTRACT
      - AR_ADDRESS
      - RECIPIENT
      - DELIVERY
      - DESTINATION
      - ORIGINAL
      - CURRENT
      - PREVIOUS
      - TEMPORARY
      - VACATION
      - GARAGE
      - EMERGENCY
      - REBATE
      - SERVICE_CONTRACT
      - INSURANCE
      - PRODUCT
      - ARCHIVE
      - OTHER
    Addresses:
      type: array
      items:
        $ref: "#/components/schemas/Address"
    AdvanceSearchTypes:
      type: string
      description: types of advance searchs.
      example: BARCODE_SCANNED_VALUE
      enum:
      - BARCODE_SCANNED_VALUE
      - PRODUCT_IMAGE_URL
      - NATURAL_LANGUAGE_QUERY
      - FREE_TEXT_SEARCH
      - WILDCARD_SEARCH_TERM
      - AI_INFERRED_KEYWORDS
      - SEARCH_INTENT_KEYWORDS
      - OCR_TEXT
    AdvanceSearchValue:
      type: object
      properties:
        advance_search_value_key:
          maxLength: 50
          minLength: 5
          type: string
          description: Unique global internal or external business key.
          example: "848538715580928000"
        search_type:
          $ref: "#/components/schemas/AdvanceSearchTypes"
        value:
          type: string
          description: "The specific value associated with the search type (e.g.,\
            \ barcode string, image URL, natural language text)."
          example: user@example.com
      description: "Represents a single advanced search input, combining a specific\
        \ search type with its corresponding value."
    AdvanceSearchValues:
      type: array
      items:
        $ref: "#/components/schemas/AdvanceSearchValue"
    AdvancedSearchCriteria:
      type: object
      properties:
        advanced_search_criteria_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538715580928001"
        advanced_search_criteria_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538715580928002"
        custom_tags:
          $ref: "#/components/schemas/Identifiers"
        wildcard_search_term:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: "Search term that may include wildcard characters (e.g., '*'\
            \ or '?') to broaden matching results."
          example:
          - Brakes
          - Oil
          items:
            type: string
        fuzzy_search_enabled:
          type: boolean
          description: "If true, enables fuzzy matching for text-based searches."
          example: true
        part_master_status_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: part_master_status_types list
          example:
          - DAMAGED
          items:
            $ref: "#/components/schemas/ProductStageTypes"
        include_assembly_components:
          type: boolean
          description: "If true, search results will include individual components\
            \ that make up an assembly."
          example: false
        image_search_confidence_threshold:
          type: string
          description: Minimum confidence score (0.0 to 1.0) for results from an AI-driven
            image search to be considered relevant. Applicable if PRODUCT_IMAGE_URL
            is one of the advanced search values.
          example: "0.75"
        exclude_keywords:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: List of keywords to exclude from search results.
          example:
          - Miami
          - Alpharetta
          items:
            type: string
        advanced_search_values:
          $ref: "#/components/schemas/AdvanceSearchValues"
      description: Criteria for advanced and specialized search functionalities.
    ApplicationStatusTypes:
      type: string
      description: types of application status.
      example: INITIATING
      enum:
      - INITIATING
      - ACTIVE
      - SALES_HOLD
      - PAYMENT_HOLD
      - FINANCE_HOLD
      - CUSTOMER_HOLD
      - APPROVED
      - DECLINED
      - REJECT
      - CANCELLED
      - ABANDON
      - COMPLETE
      - INACTIVE
      - INVALID
      - CLOSE
    AppointmentReference:
      type: object
      properties:
        appointment_reference_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538716528840706"
        appointment_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538716528840707"
        appointment_reference_value:
          type: string
          description: The unique value of the appointment reference.
          example: APPT-REF-001
        appointment_types:
          maxItems: 255
          minItems: 1
          uniqueItems: true
          type: array
          description: appointment_types list
          example:
          - TRADE_EVALUATION
          items:
            $ref: "#/components/schemas/AppointmentTypes"
        appointment_source_code:
          type: string
          description: The source code for the appointment.
          example: ONLINE
        description:
          type: string
          description: Optional description for the part identifier
          example: Vehicle engine component.
        identifiers:
          $ref: "#/components/schemas/Identifiers"
        appointment_period:
          $ref: "#/components/schemas/EffectivePeriod"
        appointment_status_type:
          $ref: "#/components/schemas/AppointmentStatusTypes"
        appointment_type:
          $ref: "#/components/schemas/AppointmentTypes"
        occurrence_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-05-21T20:44:29.108911Z
      description: nullable
    AppointmentReferences:
      type: array
      items:
        $ref: "#/components/schemas/AppointmentReference"
    AppointmentStatusTypes:
      type: string
      description: types of appointment status.
      example: WAIT_LIST
      enum:
      - WAIT_LIST
      - TENTATIVE
      - AVAILABLE
      - SELECTED
      - RESERVED
      - PREFERRED
      - CONFIRMED
      - ARRIVED
      - FULFILLED
      - ALTERNATE
      - NO_SHOW
      - CANCELLED
    AppointmentTypes:
      type: string
      description: types of appointments.
      example: SALES
      enum:
      - SALES
      - F_AND_I
      - TRADE_EVALUATION
      - TEST_DRIVE
      - DELIVERY
      - SERVICE
      - WARRANTY_REPAIR
      - VEHICLE_PICKUP
    AuthorizationLevel:
      type: object
      properties:
        update_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-05-03T11:20:34.680774Z
        authorized_indicator:
          type: boolean
          description: Indicates whether the authorization is currently active or
            granted
          example: false
        authorization_level_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538714737872900"
        auth_codes:
          $ref: "#/components/schemas/Codes"
      description: Establish authorization level
    AuthorizationLevels:
      type: array
      items:
        $ref: "#/components/schemas/AuthorizationLevel"
    AuthorizationReference:
      type: object
      properties:
        authorization_reference_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538716805664771"
        authorization_reference_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538716805664772"
        authorization_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538716805664773"
        locale:
          $ref: "#/components/schemas/Locale"
        authorization_code:
          type: string
          description: Context or domain of the identifier
          example: AUTH-12345
        source_system_code:
          type: string
          description: Context or domain of the identifier
          example: DMS
        finance_type:
          $ref: "#/components/schemas/ProgramTypes"
        context:
          type: string
          description: Context or domain of the identifier
          example: FINANCE
        account_number:
          type: string
          description: Account Number
          example: "53"
        system_codes:
          $ref: "#/components/schemas/Codes"
        identifiers:
          $ref: "#/components/schemas/Identifiers"
        occurrence_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-05-25T19:59:59.173695Z
      description: External system identifier
    AuthorizationReferences:
      type: array
      items:
        $ref: "#/components/schemas/AuthorizationReference"
    BankAccountTypes:
      type: string
      description: types of bank accounts.
      example: CHECKING
      enum:
      - CHECKING
      - SAVING
      - MONEY_MARKET
      - CD
      - BROKERAGE
      - RETIREMENT
      - OTHER
    BankBeneficiary:
      type: object
      properties:
        bank_beneficiary_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538713102094339"
        account_number:
          type: string
          description: The bank account number of the beneficiary.
          example: "43"
        address_desc:
          type: string
          description: A description of the beneficiary's address.
          example: "123 Peachtree Street NE, Atlanta, GA 30303"
        bank_account_type:
          $ref: "#/components/schemas/BankAccountTypes"
        bank_branch_address_desc:
          type: string
          description: A description of the bank branch address.
          example: "100 Bank Plaza, Atlanta, GA 30303"
        bank_country:
          type: string
          description: The country of the bank.
          example: US
        bank_name:
          type: string
          description: The name of the bank.
          example: Bank of America
        bank_swift_code:
          type: string
          description: The bank's SWIFT code.
          example: BOFAUS3N
        branch_number:
          type: string
          description: The bank branch number.
          example: "0"
        budget_code:
          type: string
          description: The budget code associated with the payment.
          example: BUD-2026-001
        contact_channel_desc:
          type: string
          description: A description of the contact channel for the beneficiary.
          example: Primary treasury contact email.
        electronic_payment_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538713102094340"
        notes:
          $ref: "#/components/schemas/Memo"
        purpose_of_payment:
          type: string
          description: The purpose of the payment.
          example: Vendor invoice payment
        routing_number:
          type: string
          description: The bank's routing number.
          example: "75"
      description: Beneficiary for Bank Payment...
    BankIntermediary:
      type: object
      properties:
        bank_intermediary_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538713102094341"
        bank_intermediary_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538713102094342"
        financial_institution_name:
          type: string
          description: The name of the financial institution.
          example: Citibank N.A.
        financial_institution_address:
          type: string
          description: The address of the financial institution.
          example: "388 Greenwich Street, New York, NY 10013"
        account_number:
          type: string
          description: The account number at the intermediary bank.
          example: "89"
        bank_swift_code:
          type: string
          description: The SWIFT/BIC code of the bank.
          example: CITIUS33
        bank_identifier_code:
          type: string
          description: The Bank Identifier Code (BIC).
          example: "021000089"
        routing_number:
          type: string
          description: The routing number for the bank.
          example: "91"
        notes:
          $ref: "#/components/schemas/Memo"
      description: "Represents an intermediary bank for electronic payments, including\
        \ details for e-checks, wire transfers, and other electronic transactions."
    BillOfMaterial:
      type: object
      properties:
        bill_of_material_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538715002114048"
        bill_of_material_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538715002114049"
        identifiers:
          $ref: "#/components/schemas/PartIdentifiers"
        product_identifier:
          type: string
          description: Identifier for the finished product or assembly this BOM describes.
          example: PROD-XYZ-ASSEMBLY
        revision:
          type: string
          description: Revision number or code for this specific BOM version.
          example: A
        effective_date:
          type: string
          description: "Calendar date associated with this value, represented in ISO-8601\
            \ date format."
          format: date
          example: 2026-05-14
        product_status_type:
          $ref: "#/components/schemas/ProductStatusTypes"
        components:
          $ref: "#/components/schemas/BomComponents"
        part_specification:
          $ref: "#/components/schemas/PartSpecification"
      description: "Represents a Bill of Material (BOM), detailing the components\
        \ and quantities required to manufacture a specific product or assembly."
    BillOfMaterialCreate:
      required:
      - bill_of_material_key
      type: object
      description: BillOfMaterial Create for Post
      allOf:
      - $ref: "#/components/schemas/BillOfMaterial"
    BillOfMaterialReference:
      type: object
      properties:
        bill_of_material_reference_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538716432371715"
        bill_of_material_reference_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538716432371716"
        bill_of_material_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538716432371717"
        context:
          type: string
          description: Context or domain of the identifier
          example: FINANCE
        system_codes:
          $ref: "#/components/schemas/Codes"
        identifier:
          $ref: "#/components/schemas/Identifier"
        occurrence_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-05-12T05:03:52.084773Z
        captured_financial_split:
          $ref: "#/components/schemas/FinancialSplitReference"
      description: External system identifier
    BillOfMaterialReferences:
      type: array
      items:
        $ref: "#/components/schemas/BillOfMaterialReference"
    BillOfMaterialUpdate:
      type: object
      properties:
        product_identifier:
          type: string
          description: Identifier for the finished product or assembly this BOM describes.
          example: PROD-XYZ-ASSEMBLY
        components:
          $ref: "#/components/schemas/BomComponents"
        identifiers:
          $ref: "#/components/schemas/PartIdentifiers"
        effective_date:
          type: string
          description: "Calendar date associated with this value, represented in ISO-8601\
            \ date format."
          format: date
          example: 2026-05-18
        product_status_type:
          $ref: "#/components/schemas/ProductStatusTypes"
        part_specification:
          $ref: "#/components/schemas/PartSpecification"
        revision:
          type: string
          description: Revision number or code for this specific BOM version.
          example: A
      description: BillOfMaterial Update for Patch and Put
    BomComponent:
      type: object
      properties:
        bom_component_id:
          type: string
          description: Unique system-specific internal identifier.
          example: "848538715006308352"
        bom_component_key:
          type: string
          description: Unique global internal or external business key.
          example: "848538715006308353"
        quantity:
          type: string
          description: The required quantity of this component for the parent assembly.
          example: "5"
        textual_details:
          $ref: "#/components/schemas/TextualDetails"
        component_identifiers:
