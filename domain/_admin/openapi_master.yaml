      - transition_to
      type: object
      properties:
        lifecycle_status_event_key:
          title: Event Key
          type: string
          description: Unique global internal or external business key.
          example: "848538713890623494"
        source_system_code:
          title: Source System Code
          maxLength: 20
          minLength: 2
