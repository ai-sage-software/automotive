      - CREATED
      - UPDATED
      - DELETED
      - ARCHIVED
      - ACTIVATED
      - DEACTIVATED
      - STATUS_CHANGED
      - SEARCHED
      - VIEWED
      - RETRIEVED
      - VEHICLE_ASSOCIATED
      - VEHICLE_DISASSOCIATED
      - LEAD_RECEIVED
      - LEAD_SOURCE_ADDED
      - LEAD_SOURCE_UPDATED
      - CONTACT_ATTEMPTED
      - CONTACTED
      - COMMUNICATION_SENT
      - COMMUNICATION_RECEIVED
      - REQUEST_RECEIVED
      - REQUEST_UPDATED
      - CONSENT_GRANTED
      - CONSENT_UPDATED
      - CONSENT_REVOKED
      - PROFILE_UPDATED
      - IDENTIFIER_ADDED
      - IDENTIFIER_UPDATED
      - IDENTIFIER_REMOVED
      - ADDRESS_ADDED
      - ADDRESS_UPDATED
      - ADDRESS_REMOVED
      - COMMUNICATION_CHANNEL_ADDED
      - COMMUNICATION_CHANNEL_UPDATED
      - COMMUNICATION_CHANNEL_REMOVED
      - PARTY_RELATIONSHIP_ADDED
      - PARTY_RELATIONSHIP_UPDATED
      - PARTY_RELATIONSHIP_REMOVED
      - MERGED
      - DUPLICATE_IDENTIFIED
      - DUPLICATE_RESOLVED
      - DATA_VALIDATED
      - DATA_CORRECTED
      - EXPORTED
      - IMPORTED
      - SYNCHRONIZED
      - OTHER
    CustomerLifecycleEvents:
      type: array
      items:
        $ref: "#/components/schemas/CustomerLifecycleEvent"
    CustomerStatusTypes:
      type: string
      description: types of customer status.
      example: ACTIVE
      enum:
      - ACTIVE
      - INACTIVE
      - PROSPECT
      - CUSTOMER
      - DORMANT
      - ARCHIVED
      - DELETED
      - MERGED
      - UNKNOWN
    CustomerUpdate:
      type: object
      properties:
        customer_lifecycle_events:
          $ref: "#/components/schemas/CustomerLifecycleEvents"
        lead_sources:
          $ref: "#/components/schemas/LeadSources"
        identifiers:
          $ref: "#/components/schemas/Identifiers"
        party_references:
          $ref: "#/components/schemas/PartyReferences"
        fingerprint:
          maxLength: 256
          minLength: 1
          type: string
          description: A stable fingerprint used to identify semantically equivalent
            evidence and prevent duplicate evidence records.
          example: d8a31abdfd53aa787285751969600e2f21799be3a69e35878fcc30bf4324d500
        garage:
          $ref: "#/components/schemas/Garage"
        preferred_language_code:
          type: string
          description: The customer's preferred language code.
          example: en-US
        occupations:
          $ref: "#/components/schemas/Codes"
        document_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-08-18T16:51:13Z
        first_time_buyer_indicator:
          type: boolean
          description: A boolean indicator for whether the customer is a first-time
            buyer.
          example: false
        authorization_levels:
          $ref: "#/components/schemas/AuthorizationLevels"
        language_codes:
          $ref: "#/components/schemas/Codes"
      description: Customer Update for Patch and Put
    CustomerUpdateTypes:
      type: string
      description: types of customer updates.
      example: INITIAL_DATA
      enum:
      - INITIAL_DATA
      - NEW_CUSTOMER
      - CUSTOMER_UPDATED
      - CUSTOMER_DELETED
      - VEHICLE_ASSOCIATED
      - VEHICLE_DISASSOCIATED
    DayOfWeekTypes:
      type: string
      description: types of day of weeks.
      example: SUN
      enum:
      - SUN
      - MON
      - TUES
      - WED
      - THURS
      - FRI
      - SAT
    DurationUomTypes:
      type: string
      description: types of duration uoms.
      example: MINUTES
      enum:
      - MINUTES
      - HOURS
      - DAYS
      - DAY_OF_MONTH
      - WEEKS
      - BI_WEEKS
      - SEMI_MONTHS
      - MONTHS
      - QUARTERS
      - SEMI_YEARS
      - YEARS
      - MULTI_YEARS
      - CUSTOM
      - OCCURRENCE
      - UNLIMITED
      - NONE
      - OTHER
    EffectivePeriod:
      type: object
      properties:
        effective_period_key:
          type: string
          description: Unique global internal or external business key.
          example: EP-2024-REG-001
        active_indicator:
          type: boolean
          description: Indicates if this period is currently considered valid and
            enforceable within the domain.
          example: true
        exclusive_indicator:
          type: boolean
          description: "If true, this period represents the only valid time window,\
            \ overriding overlapping periods."
          example: false
        start_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-08-18T16:51:13Z
        complete_date_time:
          type: string
          description: "Date and time when the event or value occurred, represented\
            \ in ISO-8601 date-time format."
          format: date-time
          example: 2026-08-18T16:51:13Z
        duration_uom_type:
          $ref: "#/components/schemas/DurationUomTypes"
        duration_value:
          pattern: ^P(?!$)((\d+Y)?(\d+M)?(\d+W)?(\d+D)?)(T(?=\d)(\d+H)?(\d+M)?(\d+S)?)?$
          type: string
          description: The length of the period expressed in ISO 8601 duration format.
          example: P1Y2M10D
        recur_uom_type:
          $ref: "#/components/schemas/DurationUomTypes"
        recur_count:
          type: string
          description: Number of times the period repeats. Use -1 for infinite.
          example: "12"
        recur_values:
          $ref: "#/components/schemas/Codes"
        recur_criteria:
          type: string
          description: Natural language or DSL expression of complex recurrence logic.
          example: Every last Friday of the month
        recur_indicator:
          type: boolean
          description: Flag indicating if this period repeats based on the defined
            criteria.
          example: true
      description: "Defines a temporal range and recurrence logic for business validity,\
        \ such as license expirations or service intervals."
    ErrorDetail:
      required:
      - category
      - code
      - message
      - timestamp
      - trace_id
      type: object
      properties:
        code:
          type: string
          description: "A machine-readable, unique system error code."
          example: NOT_FOUND_PR
        message:
          type: string
          description: A developer-friendly explanation of the error.
          example: Personnel Record with ID PR-1234567 was not found.
        category:
          type: string
          description: Classifies the error to help clients determine high-level retry
            or handling logic.
          example: DATA_INTEGRITY
          enum:
          - VALIDATION
          - AUTHENTICATION
          - AUTHORIZATION
          - INFRASTRUCTURE
          - BUSINESS_LOGIC
          - DATA_INTEGRITY
        timestamp:
          type: string
          description: The time the error occurred (ISO 8601).
          format: date-time
          example: 2025-11-10T10:30:00Z
        trace_id:
          type: string
          description: Unique system-specific internal identifier.
          example: 57c31110-859a-11ec-a8a3-0242ac120002
        doc_url:
          type: string
          description: A URL leading to the documentation page for this specific error
            code.
          format: uri
          example: https://api.docs.com/errors/NOT_FOUND_PR
        details:
          type: array
          description: Field-level validation errors or granular diagnostic information.
          example:
          - field: payrollId
            issue: must be unique
            rejected_value: "12345"
          items:
            $ref: "#/components/schemas/ErrorDetailItem"
      description: Standardized error response for the entire API ecosystem. Follows
        RFC 7807 principles for problem details to ensure consistency across microservices.
    ErrorDetailItem:
      required:
      - field
      - issue
      type: object
      properties:
        field:
